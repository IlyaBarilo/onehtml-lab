name: Проверка

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quick
        env:
          ONEHTML_TEST_RESULTS: ${{ runner.temp }}/onehtml-check-results
      - name: Сохранить диагностику сбоя проверок
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-failure
          path: ${{ runner.temp }}/onehtml-check-results
          if-no-files-found: ignore
          retention-days: 7
