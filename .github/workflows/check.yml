name: Проверка

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:build
      - run: npm run test:unit
      - run: npm run test:clean
      - run: node tests/browser.mjs --engines=chromium
      - run: node tests/stage7.mjs --engines=chromium
      - run: node tests/workspace.mjs --engines=chromium
      - run: npm run test:network
      - run: npm run test:libraries -- --engines=chromium
      - run: npm run test:draft
