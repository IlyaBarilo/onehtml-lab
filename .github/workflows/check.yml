name: Проверка

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Полная проверка (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [core, ai, libraries, media]
    env:
      CHECK_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/check.mjs --group="$CHECK_GROUP"
        env:
          ONEHTML_TEST_RESULTS: ${{ runner.temp }}/onehtml-check-results
      - name: Сохранить диагностику сбоя проверок
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: commit-check-failure-${{ matrix.group }}
          path: ${{ runner.temp }}/onehtml-check-results
          if-no-files-found: ignore
          retention-days: 7
