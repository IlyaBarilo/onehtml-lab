<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест работы библиотек</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #eaf2ff; background: #091321; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    button, input { font: inherit; }
    button { min-height: 44px; border: 1px solid #2f4561; border-radius: 10px; background: #17283e; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #82bdff; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .5; }
    .app { display: flex; flex-direction: column; height: 100%; }
    header, footer { flex: none; padding: 12px 16px; background: #101e30; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: clamp(18px, 2.5vw, 24px); }
    #scenario { width: 140px; min-height: 36px; padding: 5px 8px; border: 1px solid #3b5676; border-radius: 8px; background: #17283e; color: #eaf2ff; font: inherit; font-size: 14px; }
    .library-description { margin: 8px 0 0; color: #b8cce5; font-size: 13px; line-height: 1.4; }
    .description-row { display: flex; align-items: center; gap: 8px; }
    .description-row p { flex: 1; }
    #info-toggle { flex: none; width: 32px; min-height: 32px; margin-top: 8px; padding: 0; font-size: 20px; }
    .info-panel { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; background: #101e30; touch-action: auto; }
    .info-panel[hidden] { display: none; }
    .info-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #2f4561; }
    .info-heading h2 { margin: 0; font-size: 18px; }
    #info-close { width: 44px; font-size: 24px; }
    .info-body { overflow-y: auto; padding: 0 14px 16px; font-size: 15px; line-height: 1.5; }
    .info-body p { margin: 12px 0; }
    .app.info-open .metrics, .app.info-open .modes, .app.info-open .description-row, .app.info-open footer { display: none; }
    .app.info-open .heading { margin-bottom: 0; }
    .app.phaser-expanded header, .app.phaser-expanded .details { display: none; }
    #phaser-expand { width: 44px; padding: 0; display: grid; place-items: center; }
    #phaser-expand svg { width: 22px; height: 22px; }
    #scene-stats { position: absolute; bottom: 8px; left: 10px; padding: 5px 8px; border-radius: 6px; background: #091321cc; pointer-events: none; font-size: 14px; }
    .load[hidden] { display: none; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .metric { background: #17283e; border-radius: 10px; padding: 8px 12px; }
    .metric strong { display: block; font-size: clamp(25px, 4vw, 34px); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .metric span { display: block; margin-top: 4px; font-size: 13px; color: #a9bdd7; }
    #fps { color: #7cdbb0; }
    .modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .mode { padding: 7px 10px; text-align: left; }
    .mode b { display: block; font-size: 15px; }
    .mode small { display: block; margin-top: 3px; color: #b4c6de; font-size: 12px; }
    .library-size { display: block; margin-top: 3px; color: #b4c6de; font-size: 12px; font-variant-numeric: tabular-nums; }
    .mode[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; box-shadow: inset 0 0 0 1px #7fb8fc; }
    .mode[data-state="ready"] small { color: #91e6bb; }
    .mode[data-state="failed"] small { color: #ffadb0; }
    #stage { flex: 1; position: relative; overflow: hidden; min-height: 120px; touch-action: none; background: #091321; }
    #scene, #touches { position: absolute; inset: 0; }
    #scene canvas { display: block; }
    .phaser-hud { position: absolute; top: 36px; left: 10px; right: 10px; z-index: 1; display: flex; justify-content: space-between; gap: 6px; pointer-events: none; font-size: 14px; font-weight: 650; text-shadow: 0 1px 3px #071b29; }
    .phaser-hud span { padding: 4px 8px; border-radius: 7px; background: #071b29c9; }
    .phaser-pad { position: absolute; bottom: 8px; left: 10px; right: 10px; z-index: 1; display: flex; gap: 6px; }
    .phaser-pad button { width: 48px; min-height: 44px; background: #10293de8; border-color: #83cbb6; font-size: 22px; user-select: none; touch-action: none; }
    .phaser-pad button[data-phaser-action="jump"] { margin-left: auto; width: 94px; font-size: 15px; }
    .phaser-pad button[data-phaser-action="demo"] { width: 62px; margin-left: 4px; font-size: 13px; }
    .phaser-pad button[aria-pressed="true"] { color: #143329; background: #94ebc6; }
    .phaser-result { position: absolute; inset: 70px 12px 60px; z-index: 1; display: grid; place-content: center; gap: 6px; text-align: center; pointer-events: none; font-size: 15px; background: #091e31d9; border: 1px solid #88dfc1; border-radius: 12px; }
    .phaser-result b { font-size: 22px; }
    .phaser-result[hidden] { display: none; }
    .phaser-compact .phaser-pad { display: none; }
    .phaser-compact .phaser-hud { top: 30px; font-size: 12px; }
    .phaser-compact .phaser-hud span { padding: 2px 5px; }
    .phaser-compact .phaser-result { inset: 4px 8px; font-size: 12px; }
    .phaser-compact .phaser-result b { font-size: 16px; }
    #touches { width: 100%; height: 100%; pointer-events: none; }
    .stage-note { position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px 22px; pointer-events: none; color: #dce9fb; font-size: 14px; background: linear-gradient(#091321ed, #09132100); }
    #message { display: block; color: #ffb2ae; margin-top: 5px; }
    #paused { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: #09132188; font-size: 28px; font-weight: 700; }
    #paused[hidden] { display: none; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .load { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .load label { font-size: 14px; white-space: nowrap; }
    #load-value { font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; min-width: 30px; height: 44px; margin: 0; accent-color: #88bbff; }
    .controls button { padding: 0 14px; font-size: 14px; }
    .details { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: #a9bdd7; font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) {
      header, footer { padding: 10px; }
      h1 { font-size: 18px; }
      #scenario { width: 132px; }
      .metric { padding: 8px 10px; }
      .modes { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
      .modes::-webkit-scrollbar { height: 6px; }
      .modes::-webkit-scrollbar-thumb { background: #4c7097; border-radius: 3px; }
      .mode { flex: 0 0 150px; min-height: 70px; }
      .mode:first-child { flex-basis: 110px; }
      .mode:first-child small { margin-top: 3px; }
      .load { flex-wrap: wrap; gap: 0; }
      .load label { width: 100%; }
      input[type="range"] { height: 34px; }
      .controls { gap: 8px; }
      .controls button { padding: 0 10px; }
      .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
      .details span { white-space: nowrap; }
      .details span:last-child { grid-column: 1 / -1; }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      header, footer { padding: 6px 12px; }
      .heading { margin-bottom: 5px; }
      .metric { padding: 5px 10px; }
      .metric strong { font-size: 24px; }
      .modes { margin-top: 6px; gap: 6px; }
    }
    @media (max-height: 580px) and (max-width: 600px) {
      header, footer { padding: 6px 8px; }
      header { padding-top: 4px; padding-bottom: 4px; }
      .heading { margin-bottom: 3px; }
      #scenario { min-height: 32px; }
      .library-description { margin-top: 6px; }
      .metric { padding: 4px 8px; }
      .metric strong { font-size: 21px; }
      .metric span { margin-top: 2px; font-size: 12px; }
      .mode { flex: 0 0 138px; padding: 5px 8px; min-height: 64px; }
      .library-size { margin-top: 2px; }
      .modes { display: flex; overflow-x: auto; margin-top: 6px; padding-bottom: 4px; }
      .mode:first-child { display: block; flex-basis: 110px; }
      .mode:first-child small { margin-top: 3px; }
      input[type="range"] { height: 28px; }
      .details { margin-top: 4px; }
      #stage { min-height: 64px; }
    }
    @media (max-height: 360px) {
      body { overflow-y: auto; }
      .app { min-height: 380px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="heading"><h1>Тест библиотек</h1><select id="scenario" aria-label="Режим теста для всех движков"><option value="showcase">Возможности</option><option value="compare">Сравнение</option><option value="load">Нагрузка</option></select></div>
      <div class="metrics" aria-label="Показатели теста">
        <div class="metric"><strong id="fps">—</strong><span>FPS</span></div>
        <div class="metric"><strong id="tap-count">0</strong><span>Нажатий</span></div>
        <div class="metric" title="Текущее и максимальное число одновременных касаний"><strong id="finger-count">0 / 0</strong><span>Касания/макс.</span></div>
      </div>
      <nav class="modes" aria-label="Выбор теста">
        <button class="mode" data-mode="canvas" data-state="ready" aria-pressed="true"><b>Canvas 2D</b><small>Без библиотек</small></button>
        <button class="mode" data-mode="three160" aria-pressed="false" disabled><b>Three.js r160</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="matter" aria-pressed="false" disabled><b>Matter.js 0.20</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="phaser" aria-pressed="false" disabled><b>Phaser 3.90</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
      </nav>
      <div class="description-row"><p id="library-description" class="library-description"></p><button id="info-toggle" aria-label="Подробно о выбранной библиотеке" aria-expanded="false" aria-controls="library-info">i</button></div>
    </header>
    <section id="stage" aria-label="Поле теста: нажимайте или касайтесь несколькими пальцами">
      <div id="scene"></div>
      <canvas id="touches" aria-hidden="true"></canvas>
      <div class="stage-note"><span id="scene-name">Набережная · коснитесь сцены, чтобы сменить день и ночь</span><span id="message" role="status"></span></div>
      <div id="scene-stats" hidden></div>
      <div id="paused" hidden>Пауза</div>
      <section id="library-info" class="info-panel" aria-label="Описание библиотеки" hidden><div class="info-heading"><h2 id="info-title"></h2><button id="info-close" aria-label="Закрыть описание">×</button></div><div id="info-body" class="info-body"></div></section>
    </section>
    <footer>
      <div class="controls">
        <div class="load"><label for="load">Объектов: <b id="load-value">120</b></label><input id="load" type="range" min="20" max="10000" step="20" value="120"></div>
        <button id="pause" aria-pressed="false">Пауза</button>
        <button id="reset">Сброс</button>
      </div>
      <div class="details"><span id="frame-time">Кадр: —</span><span id="input-time">До кадра: —</span><span id="coordinates">Координаты: —</span></div>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const stage = $('stage');
      const host = $('scene');
      const overlay = $('touches');
      const touchContext = overlay.getContext('2d');
      const colors = ['#70b3ff', '#7be0b0', '#ffc777', '#c59dff', '#ff8f9f'];
      const libraries = {};
      const externalLibraryButtons = new Map();
      const sizeFormat = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 });
      const labels = {
        canvas: 'Движущиеся частицы · Canvas 2D',
        three160: 'Вращающиеся кубы · Three.js r160',
        matter: 'Физика падающих шаров · Matter.js',
        phaser: 'Движущиеся частицы · Phaser'
      };
      const descriptions = {
        canvas: 'Canvas 2D — рисование 2D без игровой библиотеки.',
        three160: 'Three.js — объёмные модели, камера, свет и тени.',
        matter: 'Matter.js — физика: масса, столкновения и связи.',
        phaser: 'Phaser — готовый набор систем для 2D-игры.'
      };
      const explanations = {
        canvas: [
          'Canvas 2D встроен в браузер. На нём можно рисовать интерфейсы, персонажей, фон, диаграммы и целые 2D-игры без дополнительных библиотек. Он подходит для небольших игр и собственных визуальных эффектов.',
          'Canvas выполняет команды рисования. Правила игры, движение, столкновения, камеры, смену уровней и учёт очков разработчик организует сам. Сложную игру тоже можно написать, но готовые игровые системы придётся создавать вручную.',
          'Возможности: набережная с многослойным фоном, водой, движущимся катером и переходом дня в ночь. Сравнение: шар и блоки рисуются Canvas, а упрощённый расчёт движения и столкновений написан в самом примере.'
        ],
        three160: [
          'Three.js даёт готовую основу для 3D: геометрию, камеры, материалы, свет, тени и работу с графическим процессором. Он полезен, когда нужен объём и пространственное движение, а не только плоский рисунок.',
          'При повороте камеры меняются перспектива, вид граней и освещение поверхностей. Three.js помогает создавать 3D-игры, просмотр моделей и пространственные сцены. Правила игры и физику столкновений нужно реализовать отдельно. В примере используется выпуск r160.',
          'Возможности: марсоход с объёмными деталями, материалами, светом и тенями; проведите по сцене, чтобы повернуть камеру. В режиме «Сравнение» Three.js строит объёмные шар и блоки с тенями; физику для них рассчитывает код примера.'
        ],
        matter: [
          'Matter.js рассчитывает 2D-физику твёрдых тел: падение, массу, трение, удары, вращение, связи и шарниры. Он нужен для головоломок с конструкциями, катапульт, маятников, падающих башен и механизмов, где поведение предметов должно зависеть от их взаимодействия.',
          'Matter.js не рисует красивую игру вместо автора и не организует уровни, очки или персонажей. В этом примере изображение рисует Canvas, а библиотека рассчитывает движение тел и связи между ними. Для простой анимации без физики Matter.js не требуется.',
          'Возможности: маятники, гибкий мост и перетаскивание тел. Сравнение: тот же шар ударяет ту же башню, но столкновения, наклон и вращение блоков рассчитывает Matter.js. Именно поведение после удара показывает разницу с упрощённым расчётом Canvas.'
        ],
        phaser: [
          'Phaser — набор готовых систем для 2D-игры: игровой цикл, сцены, персонажи и картинки, анимации, ввод, камеры, таймеры, частицы, звуки и физика. Он полезен для аркад, платформеров и игр с несколькими уровнями, множеством объектов и игровыми событиями.',
          'Его преимущество — объём готовой работы: можно настроить столкновение, анимацию, появление объектов по таймеру и эффект получения предмета, вместо того чтобы отдельно строить эти системы на Canvas. Правила, оформление и содержание игры всё равно задаёт автор. Такую же картинку можно нарисовать без Phaser; библиотека помогает организовать поведение всей игры. Кроме простой Arcade Physics, Phaser поддерживает и Matter для сложной физики.',
          'Возможности: платформер «Лесная станция». Камера сопровождает робота через лес, переправу и станцию; дальний фон движется медленнее переднего. Arcade Physics рассчитывает прыжки, столкновения, перевозку на движущихся платформах и встречи с противниками. Анимации оживляют персонажей, таймер включает лазер, частицы и всплывающие очки отмечают сбор кристаллов. Есть двойной прыжок, здоровье, контрольная точка и завершение уровня. Демо проходит уровень автоматически; кнопки направления и прыжка либо стрелки/A/D и пробел передают управление вам. В низком поле робот бежит сам, касание вызывает прыжок. Сравнение: тот же шар и башня используют встроенную Matter-физику Phaser и частицы при ударе. Для вращающихся конструкций нужна Matter, а для прямоугольных платформ и персонажей подходит Arcade Physics.'
        ]
      };
      const showcaseLabels = {
        canvas: 'Набережная · касание переключает день и ночь',
        three160: 'Марсоход · проведите по сцене, чтобы повернуть камеру',
        matter: 'Механизмы · перетаскивайте тела или толкните маятники',
        phaser: 'Лесная станция · двойной прыжок'
      };
      const pointers = new Map();
      let rings = [];
      let width = 1, height = 1, ratio = 1;
      let mode = 'canvas', objectCount = 120, activeScene = null;
      let scenario = 'showcase', infoOpen = false;
      let phaserExpanded = false;
      let paused = false, tapCount = 0, peakPointers = 0, pendingInput = null;
      let frameStart = 0, frames = 0, lastFrame = null;
      let generation = 0;
      let resizeRequest = null;

      function resetFps() {
        frameStart = performance.now();
        frames = 0;
        lastFrame = null;
        $('fps').textContent = '—';
        $('frame-time').textContent = 'Кадр: —';
      }

      function frameRendered(time) {
        if (frames === 0) frameStart = time;
        frames += 1;
        if (pendingInput !== null) {
          $('input-time').textContent = `До кадра: ${Math.max(0, time - pendingInput).toFixed(1)} мс`;
          pendingInput = null;
        }
        const elapsed = time - frameStart;
        if (elapsed >= 800) {
          const fps = (frames - 1) * 1000 / elapsed;
          $('fps').textContent = String(Math.round(fps));
          $('frame-time').textContent = `Кадр: ${(1000 / fps).toFixed(1)} мс`;
          frames = 1;
          frameStart = time;
        }
        drawTouches(time);
      }

      function drawTouches(time) {
        touchContext.clearRect(0, 0, width, height);
        rings = rings.filter(ring => time - ring.time < 650);
        for (const ring of rings) {
          const progress = (time - ring.time) / 650;
          touchContext.globalAlpha = 1 - progress;
          touchContext.strokeStyle = '#fff';
          touchContext.lineWidth = 2;
          touchContext.beginPath();
          touchContext.arc(ring.x, ring.y, 12 + progress * 45, 0, Math.PI * 2);
          touchContext.stroke();
        }
        touchContext.globalAlpha = 1;
        for (const point of pointers.values()) {
          touchContext.fillStyle = '#b9deff66';
          touchContext.strokeStyle = '#d9edff';
          touchContext.lineWidth = 2;
          touchContext.beginPath();
          touchContext.arc(point.x, point.y, 24, 0, Math.PI * 2);
          touchContext.fill();
          touchContext.stroke();
        }
      }

      function makeCanvas() {
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        host.append(canvas);
        const context = canvas.getContext('2d');
        context.scale(ratio, ratio);
        return context;
      }

      function particles() {
        return Array.from({ length: objectCount }, (_, index) => ({
          x: Math.random() * width, y: Math.random() * height,
          vx: (Math.random() - .5) * 180, vy: (Math.random() - .5) * 180,
          r: 3 + Math.random() * 5, color: colors[index % colors.length]
        }));
      }

      function moveParticle(particle, seconds) {
        particle.x += particle.vx * seconds;
        particle.y += particle.vy * seconds;
        if (particle.x < particle.r || particle.x > width - particle.r) particle.vx *= -1;
        if (particle.y < particle.r || particle.y > height - particle.r) particle.vy *= -1;
        particle.x = Math.max(particle.r, Math.min(width - particle.r, particle.x));
        particle.y = Math.max(particle.r, Math.min(height - particle.r, particle.y));
      }

      function canvasScene() {
        const context = makeCanvas();
        const items = particles();
        return {
          tick(delta) {
            context.clearRect(0, 0, width, height);
            for (const item of items) {
              moveParticle(item, delta / 1000);
              context.fillStyle = item.color;
              context.beginPath();
              context.arc(item.x, item.y, item.r, 0, Math.PI * 2);
              context.fill();
            }
          },
          tap(x, y) {
            for (const item of items) {
              const dx = item.x - x, dy = item.y - y, distance = Math.max(20, Math.hypot(dx, dy));
              item.vx += dx / distance * 60;
              item.vy += dy / distance * 60;
            }
          },
          dispose() {}
        };
      }

      function threeScene(Three) {

      function comparisonLayout() {

        const size = bytes < 1024 ? `${sizeFormat.format(bytes)} Б` : `${sizeFormat.format(bytes / 1024)} КБ`;
        field.textContent = known ? `Размер: ${size}` : 'Размер: (нет данных)';
        field.title = known ? `${bytes} байт JS-кода; без сетевого сжатия` : 'Браузер не сообщил размер загруженного JS-файла';
      }

      if ('PerformanceObserver' in window) {
        try {
          const observer = new PerformanceObserver(list => {
            for (const entry of list.getEntries()) {
              const button = externalLibraryButtons.get(entry.name);
              if (button) showLibrarySize(button, entry.decodedBodySize);
            }
          });
          observer.observe({ type: 'resource', buffered: true });
        } catch {}
      }

      window.registerLabLibrary = (id, library) => {
        const button = document.querySelector(`[data-mode="${id}"]`);
        libraries[id] = library;
        button.disabled = !library;
        button.dataset.state = library ? 'ready' : 'failed';
        const libraryScript = document.currentScript?.previousElementSibling;
        const embedded = libraryScript?.tagName === 'SCRIPT' && !libraryScript.hasAttribute('src');
        const remote = /^(?:https?:)?\/\//i.test(libraryScript?.getAttribute('src') || '');
        button.querySelector('small').textContent = library ? (embedded ? 'Встроена в HTML' : remote ? 'Загружена с CDN' : 'Загружена из файла') : 'Не загружена';
        if (library && embedded) {
          showLibrarySize(button, new TextEncoder().encode(libraryScript.textContent).byteLength);
        } else if (library && libraryScript?.src) {
          externalLibraryButtons.set(libraryScript.src, button);
          const entry = performance.getEntriesByName(libraryScript.src, 'resource').slice(-1)[0];
          showLibrarySize(button, entry?.decodedBodySize);
        } else showLibrarySize(button, null);
      };

      stage.addEventListener('pointerdown', event => {
        if (infoOpen) return;
        event.preventDefault();
        const bounds = stage.getBoundingClientRect();
        const point = { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
        pointers.set(event.pointerId, point);
        stage.setPointerCapture(event.pointerId);
        tapCount += 1;
        peakPointers = Math.max(peakPointers, pointers.size);
        const time = performance.now();
        pendingInput = paused ? null : time;
        rings.push({ ...point, time });
        $('tap-count').textContent = String(tapCount);
        $('finger-count').textContent = `${pointers.size} / ${peakPointers}`;
        $('coordinates').textContent = `Координаты: ${Math.round(point.x)}, ${Math.round(point.y)}`;
        if (!paused) activeScene?.tap(point.x, point.y, event.pointerId, event.target.closest('[data-phaser-action]')?.dataset.phaserAction);
        drawTouches(performance.now());
      });
      stage.addEventListener('pointermove', event => {
        if (!pointers.has(event.pointerId)) return;
        const bounds = stage.getBoundingClientRect();
        pointers.set(event.pointerId, { x: event.clientX - bounds.left, y: event.clientY - bounds.top });
        if (!paused) activeScene?.drag?.(event.clientX - bounds.left, event.clientY - bounds.top);
        drawTouches(performance.now());
      });
      for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) stage.addEventListener(name, event => {
        pointers.delete(event.pointerId);
        activeScene?.release?.(event.pointerId);
        $('finger-count').textContent = `${pointers.size} / ${peakPointers}`;
        drawTouches(performance.now());
      });
      document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => startScene(button.dataset.mode)));
      $('info-toggle').addEventListener('click', () => showInfo(!infoOpen));
      $('info-close').addEventListener('click', () => showInfo(false));
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && infoOpen) showInfo(false); });
      $('scenario').addEventListener('change', event => { scenario = event.target.value; startScene(); });
      $('load').addEventListener('input', event => { $('load-value').textContent = event.target.value; });
      $('load').addEventListener('change', event => { objectCount = Number(event.target.value); startScene(); });
      $('pause').addEventListener('click', () => {
        paused = !paused;
        $('pause').textContent = paused ? 'Продолжить' : 'Пауза';
        $('pause').setAttribute('aria-pressed', String(paused));
        $('paused').hidden = !paused;
        activeScene.pause?.(paused || infoOpen || document.hidden);
        pendingInput = null;
        resetFps();
      });
      $('reset').addEventListener('click', () => {
        tapCount = 0; peakPointers = pointers.size; rings = []; pendingInput = null;
        $('tap-count').textContent = '0';
        $('finger-count').textContent = `${pointers.size} / ${peakPointers}`;
        $('input-time').textContent = 'До кадра: —';
        $('coordinates').textContent = 'Координаты: —';
        startScene();
      });
      document.addEventListener('visibilitychange', () => {
        pointers.clear();
        activeScene?.release?.();
        $('finger-count').textContent = `0 / ${peakPointers}`;
        activeScene.pause?.(paused || infoOpen || document.hidden);
        resetFps();
      });
      new ResizeObserver(() => {
        if (resizeRequest !== null) return;
        resizeRequest = requestAnimationFrame(() => { resizeRequest = null; resize(); });
      }).observe(stage);
      resize();
      function animate(time) {
        requestAnimationFrame(animate);
        if (paused || infoOpen || document.hidden || activeScene?.ownLoop) return;
        const delta = lastFrame === null ? 1000 / 60 : Math.min(40, time - lastFrame);
        lastFrame = time;
        activeScene?.tick(delta);
        frameRendered(performance.now());
      }
      requestAnimationFrame(animate);
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>registerLabLibrary('three160', window.THREE?.REVISION === '160' ? window.THREE : null);</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script>registerLabLibrary('matter', window.Matter?.version === '0.20.0' ? window.Matter : null);</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script>registerLabLibrary('phaser', window.Phaser?.VERSION === '3.90.0' ? window.Phaser : null);</script>
</body>
