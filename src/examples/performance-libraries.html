<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест работы библиотек</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #eaf2ff; background: #091321; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    button, input { font: inherit; }
    button { min-height: 44px; border: 1px solid #2f4561; border-radius: 10px; background: #17283e; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #82bdff; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .5; }
    .app { display: flex; flex-direction: column; height: 100%; }
    header, footer { flex: none; padding: 12px 16px; background: #101e30; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: clamp(18px, 2.5vw, 24px); }
    #scenario { width: 140px; min-height: 36px; padding: 5px 8px; border: 1px solid #3b5676; border-radius: 8px; background: #17283e; color: #eaf2ff; font: inherit; font-size: 14px; }
    .library-description { margin: 8px 0 0; color: #b8cce5; font-size: 13px; line-height: 1.4; }
    .description-row { display: flex; align-items: center; gap: 8px; }
    .description-row p { flex: 1; min-width: 0; }
    #phaser-renderer { flex: none; display: flex; gap: 4px; margin-top: 8px; }
    #phaser-renderer[hidden] { display: none; }
    #phaser-renderer button { min-height: 44px; padding: 5px 8px; font-size: 14px; }
    #phaser-renderer button[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; color: #eaf2ff; }
    #phaser-renderer button:focus-visible { outline: 3px solid #82bdff; outline-offset: 2px; }
    #three-quality { flex: none; display: flex; gap: 4px; margin-top: 8px; }
    #three-quality[hidden] { display: none; }
    #three-quality button { min-height: 44px; padding: 5px 8px; font-size: 14px; }
    #three-quality button[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; }
    #cannon-physics { display: flex; flex: none; gap: 4px; margin-top: 8px; }
    #cannon-physics[hidden] { display: none; }
    #cannon-physics button { min-height: 44px; padding: 5px 8px; font-size: 14px; }
    #cannon-physics button[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; }
    .cannon-description { flex-wrap: wrap; }
    .cannon-description .library-description { flex-basis: 100%; }
    .cannon-description #info-toggle { margin-left: auto; }
    .app.three-expanded .heading, .app.three-expanded .metrics, .app.three-expanded .modes, .app.three-expanded .details { display: none; }
    .app.three-expanded header { padding: 4px 10px; }
    #three-hints, #three-expand { width: 44px; padding: 0; flex: none; display: grid; place-items: center; }
    #three-hints svg, #three-expand svg { width: 22px; height: 22px; }
    #three-hints[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; }
    .three-hint-overlay { position: absolute; inset: 0; pointer-events: none; }
    .three-hint-overlay[hidden] { display: none; }
    .three-hint-caption { position: absolute; top: 8px; left: 10px; right: 10px; width: fit-content; max-width: calc(100% - 20px); padding: 7px 10px; border: 1px solid #88bbff; border-radius: 8px; background: #091e31; font-size: 14px; line-height: 1.35; }
    .three-hint-overlay > svg { width: 100%; height: 100%; overflow: hidden; }
    .three-still { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #scene .three-still[hidden] { display: none; }
    .three-hint-overlay text { fill: #dcecff; font: 600 14px system-ui, sans-serif; paint-order: stroke; stroke: #091e31; stroke-width: 4px; }
    #stage:has(.three-hint-overlay:not([hidden])) #paused, #stage:has(.three-hint-overlay:not([hidden])) .stage-note { visibility: hidden; }
    #info-toggle { flex: none; width: 32px; min-height: 32px; margin-top: 8px; padding: 0; font-size: 20px; }
    .info-panel { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; background: #101e30; touch-action: auto; }
    .info-panel[hidden] { display: none; }
    .info-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #2f4561; }
    .info-heading h2 { margin: 0; font-size: 18px; }
    #info-close { width: 44px; font-size: 24px; }
    .info-body { overflow-y: auto; padding: 0 14px 16px; font-size: 15px; line-height: 1.5; }
    .info-body p { margin: 12px 0; }
    .info-body .recommendation { padding: 10px 12px; border-left: 3px solid #88bbff; background: #17283e; }
    .app.info-open .metrics, .app.info-open .modes, .app.info-open .description-row, .app.info-open footer { display: none; }
    .app.info-open .heading { margin-bottom: 0; }
    .app.phaser-expanded header, .app.phaser-expanded .details { display: none; }
    #phaser-expand { width: 44px; padding: 0; display: grid; place-items: center; }
    #phaser-expand svg { width: 22px; height: 22px; }
    #phaser-hints { width: 44px; padding: 0; display: grid; place-items: center; }
    #phaser-hints svg { width: 22px; height: 22px; }
    #phaser-effects { width: 44px; padding: 0; display: grid; place-items: center; flex: none; }
    #phaser-effects svg { width: 22px; height: 22px; }
    #phaser-hints[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; }
    .phaser-hint-overlay { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .phaser-hint-overlay[hidden] { display: none; }
    .phaser-hint-caption { position: absolute; top: 8px; left: 10px; right: 66px; width: fit-content; max-width: calc(100% - 76px); padding: 7px 10px; border: 1px solid #88bbff; border-radius: 8px; background: #091e31; font-size: 14px; line-height: 1.35; }
    .phaser-hint-caption b { display: block; margin-bottom: 3px; color: #a9d0ff; }
    .phaser-hint-overlay > svg { width: 100%; height: 100%; overflow: hidden; filter: drop-shadow(0 1px 2px #091321); }
    .phaser-hint-view .phaser-hud, .phaser-hint-view .phaser-pad { visibility: hidden; }
    #stage:has(.phaser-hint-view) #paused { visibility: hidden; }
    #stage:has(.phaser-hint-view) .stage-note { visibility: hidden; }
    .phaser-hint-view.phaser-compact .phaser-hint-caption { top: 2px; left: 6px; padding: 3px 6px; font-size: 12px; }
    .phaser-hint-view.phaser-compact .phaser-hint-caption b { display: none; }
    #scene-stats { position: absolute; bottom: 8px; left: 10px; padding: 5px 8px; border-radius: 6px; background: #091321cc; pointer-events: none; font-size: 14px; }
    .load[hidden] { display: none; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .metric { background: #17283e; border-radius: 10px; padding: 8px 12px; }
    .metric strong { display: block; font-size: clamp(25px, 4vw, 34px); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .metric span { display: block; margin-top: 4px; font-size: 13px; color: #a9bdd7; }
    #fps { color: #7cdbb0; }
    .modes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .mode { padding: 7px 10px; text-align: left; }
    .mode b { display: block; font-size: 15px; }
    .mode small { display: block; margin-top: 3px; color: #b4c6de; font-size: 12px; }
    .library-size { display: block; margin-top: 3px; color: #b4c6de; font-size: 12px; font-variant-numeric: tabular-nums; }
    .mode[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; box-shadow: inset 0 0 0 1px #7fb8fc; }
    .mode[data-state="ready"] small { color: #91e6bb; }
    .mode[data-state="failed"] small { color: #ffadb0; }
    #stage { flex: 1; position: relative; overflow: hidden; min-height: 120px; touch-action: none; background: #091321; }
    #scene, #touches { position: absolute; inset: 0; }
    #scene canvas { display: block; }
    .phaser-hud { position: absolute; top: 36px; left: 10px; right: 66px; z-index: 1; display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; pointer-events: none; font-size: 14px; font-weight: 650; text-shadow: 0 1px 3px #071b29; }
    .phaser-hud span { padding: 4px 8px; border-radius: 7px; background: #071b29c9; }
    #phaser-time { position: absolute; top: 36px; right: 10px; z-index: 1; width: 44px; padding: 0; display: grid; place-items: center; background: #10293de8; border-color: #83cbb6; }
    #phaser-time svg { width: 22px; height: 22px; }
    .phaser-compact #phaser-time { top: 30px; }
    .phaser-pad { position: absolute; bottom: 8px; left: 10px; right: 10px; z-index: 1; display: flex; gap: 6px; }
    .phaser-pad button { width: 48px; min-height: 44px; background: #10293de8; border-color: #83cbb6; font-size: 22px; user-select: none; touch-action: none; }
    .phaser-pad button[data-phaser-action="jump"] { margin-left: auto; width: 94px; font-size: 15px; }
    .phaser-pad button[data-phaser-action="demo"] { width: 62px; margin-left: 4px; font-size: 13px; }
    .phaser-pad button[aria-pressed="true"] { color: #143329; background: #94ebc6; }
    .phaser-result { position: absolute; inset: 70px 12px 60px; z-index: 1; display: grid; place-content: center; gap: 6px; text-align: center; pointer-events: none; font-size: 15px; background: #091e31d9; border: 1px solid #88dfc1; border-radius: 12px; }
    .phaser-result b { font-size: 22px; }
    .phaser-result[hidden] { display: none; }
    .phaser-compact .phaser-pad { display: none; }
    .phaser-compact .phaser-hud { top: 30px; font-size: 12px; }
    .phaser-compact .phaser-hud span { padding: 2px 5px; }
    .phaser-compact .phaser-result { inset: 4px 8px; font-size: 12px; }
    .phaser-compact .phaser-result b { font-size: 16px; }
    #touches { width: 100%; height: 100%; pointer-events: none; }
    .stage-note { position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px 22px; pointer-events: none; color: #dce9fb; font-size: 14px; background: linear-gradient(#091321ed, #09132100); }
    #message { display: block; color: #ffb2ae; margin-top: 5px; }
    #paused { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: #09132188; font-size: 28px; font-weight: 700; }
    #paused[hidden] { display: none; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .load { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .load label { font-size: 14px; white-space: nowrap; }
    #load-value { font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; min-width: 30px; height: 44px; margin: 0; accent-color: #88bbff; }
    .controls button { padding: 0 14px; font-size: 14px; }
    #phaser-effects[aria-pressed="true"] { background: #234775; border-color: #7fb8fc; }
    .details { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: #a9bdd7; font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) {
      header, footer { padding: 10px; }
      h1 { font-size: 18px; }
      #scenario { width: 132px; }
      .metric { padding: 8px 10px; }
      .modes { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
      .modes::-webkit-scrollbar { height: 6px; }
      .modes::-webkit-scrollbar-thumb { background: #4c7097; border-radius: 3px; }
      .mode { flex: 0 0 150px; min-height: 70px; }
      .mode:first-child { flex-basis: 110px; }
      .mode:first-child small { margin-top: 3px; }
      .phaser-description .library-description { min-height: 2.8em; }
      .load { flex-wrap: wrap; gap: 0; }
      .load label { width: 100%; }
      input[type="range"] { height: 34px; }
      .controls { gap: 8px; }
      .controls button { padding: 0 10px; }
      .controls:has(#phaser-hints) { gap: 4px; }
      .controls:has(#phaser-hints) button { padding: 0 4px; }
      .controls #phaser-hints, .controls #phaser-expand, .controls #phaser-effects { padding: 0; flex: none; }
      .controls #three-hints, .controls #three-expand { padding: 0; }
      .three-description { flex-wrap: wrap; gap: 4px 8px; }
      .three-description .library-description { flex-basis: 100%; margin-top: 4px; }
      .three-description #three-quality, .three-description #info-toggle { margin-top: 0; }
      .three-description #info-toggle { margin-left: auto; }
      .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
      .details span { white-space: nowrap; }
      .details span:last-child { grid-column: 1 / -1; }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      header, footer { padding: 6px 12px; }
      .heading { margin-bottom: 5px; }
      .metric { padding: 5px 10px; }
      .metric strong { font-size: 24px; }
      .modes { margin-top: 6px; gap: 6px; }
    }
    @media (max-height: 580px) and (max-width: 600px) {
      header, footer { padding: 6px 8px; }
      header { padding-top: 4px; padding-bottom: 4px; }
      .heading { gap: 6px; margin-bottom: 2px; }
      .heading h1 { flex-shrink: 0; white-space: nowrap; }
      #scenario { min-height: 32px; }
      .library-description, #info-toggle, #phaser-renderer { margin-top: 4px; }
      .metric { padding: 3px 6px; }
      .metrics { grid-template-columns: 1fr 1fr 1.3fr; }
      .metric strong { font-size: 21px; }
      .metric span { margin-top: 2px; font-size: 12px; line-height: 1.2; }
      .mode { flex: 0 0 160px; padding: 5px 8px; min-height: 64px; }
      .library-size { margin-top: 2px; }
      .modes { display: flex; overflow-x: auto; margin-top: 3px; padding-bottom: 2px; }
      .mode:first-child { display: block; flex-basis: 110px; }
      .mode:first-child small { margin-top: 3px; }
      input[type="range"] { height: 28px; }
      .load label { white-space: normal; line-height: 1.2; }
      .details { display: flex; overflow-x: auto; gap: 12px; margin-top: 4px; font-size: 12px; scrollbar-width: thin; }
      .details::-webkit-scrollbar { height: 4px; }
      #stage { min-height: 64px; }
      .three-description .library-description, .cannon-description .library-description { display: none; }
      #cannon-physics { margin-top: 4px; }
    }
    @media (max-height: 360px) {
      body { overflow-y: auto; }
      .app { min-height: 380px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="heading"><h1>Тест библиотек</h1><select id="scenario" aria-label="Режим теста для всех движков"><option value="showcase">Возможности</option><option value="compare">Сравнение</option><option value="load">Нагрузка</option></select></div>
      <div class="metrics" aria-label="Показатели теста">
        <div class="metric"><strong id="fps">—</strong><span>FPS</span></div>
        <div class="metric"><strong id="tap-count">0</strong><span>Нажатий</span></div>
        <div class="metric" title="Текущее и максимальное число одновременных касаний"><strong id="finger-count">0 / 0</strong><span>Касания/макс.</span></div>
      </div>
      <nav class="modes" aria-label="Выбор теста">
        <button class="mode" data-mode="canvas" data-state="ready" aria-pressed="true"><b>Canvas 2D</b><small>Без библиотек</small></button>
        <button class="mode" data-mode="three160" aria-pressed="false" disabled><b>Three.js r160</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="cannon" aria-pressed="false" disabled title="3D-физика для сцены Three.js"><b>cannon-es 0.20</b><small>Не загружена</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="babylon" aria-pressed="false" disabled><b>Babylon.js 9.30</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="matter" aria-pressed="false" disabled><b>Matter.js 0.20</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="phaser" aria-pressed="false" disabled><b>Phaser 3.90</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
        <button class="mode" data-mode="phaser4" aria-pressed="false" disabled><b>Phaser 4.2.1</b><small>Загрузка…</small><span class="library-size">Размер: —</span></button>
      </nav>
      <div class="description-row"><p id="library-description" class="library-description"></p><div id="phaser-renderer" role="group" aria-label="Отрисовка Phaser" hidden><button data-renderer="canvas" aria-pressed="false">Canvas</button><button data-renderer="webgl" aria-pressed="true">WebGL</button></div><div id="three-quality" role="group" aria-label="Оформление Three.js" hidden><button data-quality="simple" aria-pressed="false">Простое</button><button data-quality="detailed" aria-pressed="true">Подробное</button></div><div id="cannon-physics" role="group" aria-label="Физика башни" hidden><button data-physics="simple" aria-pressed="false">Без физики</button><button data-physics="bodies" aria-pressed="true">cannon-es</button></div><button id="info-toggle" title="Какую библиотеку и отрисовку выбрать" aria-label="Подробно о выбранной библиотеке" aria-expanded="false" aria-controls="library-info">?</button></div>
    </header>
    <section id="stage" aria-label="Поле теста: нажимайте или касайтесь несколькими пальцами">
      <div id="scene"></div>
      <canvas id="touches" aria-hidden="true"></canvas>
      <div class="stage-note"><span id="scene-name">Набережная · коснитесь сцены, чтобы сменить день и ночь</span><span id="message" role="status"></span></div>
      <div id="scene-stats" hidden></div>
      <div id="paused" hidden>Пауза</div>
      <section id="library-info" class="info-panel" aria-label="Описание библиотеки" hidden><div class="info-heading"><h2 id="info-title"></h2><button id="info-close" aria-label="Закрыть описание">×</button></div><div id="info-body" class="info-body"></div></section>
    </section>
    <footer>
      <div class="controls">
        <div class="load"><label for="load">Объектов: <b id="load-value">120</b></label><input id="load" type="range" min="20" max="10000" step="20" value="120"></div>
        <button id="pause" aria-pressed="false">Пауза</button>
        <button id="reset">Сброс</button>
      </div>
      <div class="details"><span id="frame-time">Кадр: —</span><span id="input-time">До кадра: —</span><span id="coordinates">Координаты: —</span></div>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const stage = $('stage');
      const host = $('scene');
      const overlay = $('touches');
      const touchContext = overlay.getContext('2d');
      const colors = ['#70b3ff', '#7be0b0', '#ffc777', '#c59dff', '#ff8f9f'];
      const libraries = {};
      const externalLibraryButtons = new Map();
      const integerFormat = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
      const integer = value => integerFormat.format(value);
      const sizeFormat = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 });
      const labels = {
        canvas: 'Движущиеся частицы · Canvas 2D',
        three160: 'Вращающиеся кубы · Three.js r160',
        cannon: 'Физические блоки · Three.js + cannon-es',
        babylon: 'Вращающиеся кубы · Babylon.js 9.30.0',
        matter: 'Физика падающих шаров · Matter.js',
        phaser: 'Движущиеся частицы · Phaser 3',
        phaser4: 'Движущиеся частицы · Phaser 4'
      };
      const descriptions = {
        canvas: 'Canvas 2D — рисование 2D без игровой библиотеки.',
        three160: 'Three.js — объёмные модели, камера, свет и тени.',
        cannon: 'Three.js рисует, cannon-es рассчитывает движение и удары.',
        babylon: 'Babylon.js — 3D-движок: камеры, материалы и сцены.',
        matter: 'Matter.js — физика: масса, столкновения и связи.',
        phaser: 'Phaser 3 — движок для 2D-аркад и платформеров.',
        phaser4: 'Phaser 4 — 2D-игры с динамическим светом и эффектами.'
      };
      const explanations = {
        canvas: [
          'Canvas 2D рисует без дополнительных библиотек. Подходит для небольших игр и анимаций. Правила игры и столкновения нужно написать самостоятельно.',
          'Коснитесь набережной, чтобы переключить день и ночь. В «Сравнении» касание запускает шар в башню.'
        ],
        three160: [
          'Three.js — объёмные модели, камеры, материалы, свет и тени. Подходит для 3D-игр и просмотра моделей. Правила игры и физику нужно добавить отдельно.',
          '«Простое» — матовые однотонные поверхности. «Подробное» — текстуры, мелкий рельеф, отражения и тени. Посмотрите на полосы металла, рисунок солнечных панелей и зернистый грунт. Модель и свет одинаковые; FPS зависит от устройства.',

      for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) stage.addEventListener(name, event => {
        pointers.delete(event.pointerId);
        activeScene?.release?.(event.pointerId);
        $('finger-count').textContent = `${integer(pointers.size)} / ${integer(peakPointers)}`;
        drawTouches(performance.now());
      });
      document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => startScene(button.dataset.mode, true)));
      $('info-toggle').addEventListener('click', () => showInfo(!infoOpen));
      $('info-close').addEventListener('click', () => showInfo(false));
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && infoOpen) showInfo(false); });
      document.addEventListener('keydown', event => {
        if (mode !== 'cannon' || paused || infoOpen || document.hidden || event.code !== 'Space' || event.repeat || /^(INPUT|BUTTON|SELECT)$/.test(event.target.tagName) || event.ctrlKey || event.metaKey || event.altKey) return;
        event.preventDefault(); activeScene?.tap(width * .7, height * .65);
      });
      $('scenario').addEventListener('change', event => { scenario = event.target.value; startScene(); });
      $('cannon-physics').querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        const enabled = button.dataset.physics === 'bodies'; if (enabled === cannonEnabled) return; cannonEnabled = enabled; startScene();
      }));
      $('phaser-renderer').querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        if (button.dataset.renderer === phaserRenderer) return;
        phaserRenderer = button.dataset.renderer; startScene();
      }));
      $('three-quality').querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        const detailed = button.dataset.quality === 'detailed';
        if (detailed === threeDetailed) return;
        threeDetailed = detailed; activeScene?.setQuality?.(); resetFps();
      }));
      $('load').addEventListener('input', event => { $('load-value').textContent = integer(Number(event.target.value)); });
      $('load').addEventListener('change', event => { objectCount = Number(event.target.value); startScene(); });
      $('pause').addEventListener('click', () => {
        paused = !paused;
        $('pause').textContent = paused ? 'Продолжить' : 'Пауза';
        $('pause').setAttribute('aria-pressed', String(paused));
        $('paused').hidden = !paused;
        activeScene.pause?.(paused || infoOpen || document.hidden);
        pendingInput = null;
        resetFps();
      });
      $('reset').addEventListener('click', () => {
        tapCount = 0; peakPointers = pointers.size; rings = []; pendingInput = null;
        $('tap-count').textContent = '0';
        $('finger-count').textContent = `${integer(pointers.size)} / ${integer(peakPointers)}`;
        $('input-time').textContent = 'До кадра: —';
        $('coordinates').textContent = 'Координаты: —';
        startScene();
      });
      document.addEventListener('visibilitychange', () => {
        pointers.clear();
        activeScene?.release?.();
        $('finger-count').textContent = `0 / ${integer(peakPointers)}`;
        activeScene.pause?.(paused || infoOpen || document.hidden);
        resetFps();
      });
      new ResizeObserver(() => {
        if (resizeRequest !== null) return;
        resizeRequest = requestAnimationFrame(() => { resizeRequest = null; resize(); });
      }).observe(stage);
      resize();
      function animate(time) {
        requestAnimationFrame(animate);
        if (paused || infoOpen || document.hidden || activeScene?.ownLoop) return;
        const delta = lastFrame === null ? 1000 / 60 : Math.min(40, time - lastFrame);
        lastFrame = time;
        activeScene?.tick(delta);
        frameRendered(performance.now());
      }
      requestAnimationFrame(animate);
    })();
  </script>
