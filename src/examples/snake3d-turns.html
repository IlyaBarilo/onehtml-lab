<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var S,C,R,clk,shead=[],fr=[],tr=[],bu=[],bf=[],pth=[],ptc=[],G='menu';
var sc=0,hi=0,lv=1,fe=0,spd=0.07,bsp=0.07,trn=0.04,h=0,hp={x:0,z:0},bl=5,ss=0.42,gs=28;
var tl=false,tr2=false,tt=0,tm,shk=0,actx;
hi=parseInt(localStorage.getItem('s3d_hi')||'0');
var FT=[{c:0xe53935,p:10},{c:0xfb8c00,p:15},{c:0xfdd835,p:20},{c:0x8e24aa,p:25},{c:0xffd700,p:50}];

function init(){
S=new THREE.Scene();S.fog=new THREE.Fog(0x87CEEB,12,40);S.background=new THREE.Color(0x87CEEB);
C=new THREE.PerspectiveCamera(75,innerW()/innerH(),0.1,100);
R=new THREE.WebGLRenderer({antialias:true});
R.setSize(innerW(),innerH());R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
el('cc').appendChild(R.domElement);
S.add(new THREE.AmbientLight(0xffffff,0.55));
var su=new THREE.DirectionalLight(0xfff5e1,0.85);su.position.set(8,18,8);
su.castShadow=true;su.shadow.mapSize.width=1024;su.shadow.mapSize.height=1024;
su.shadow.camera.left=-22;su.shadow.camera.right=22;su.shadow.camera.top=22;su.shadow.camera.bottom=-22;
su.shadow.camera.far=50;S.add(su);
S.add(new THREE.HemisphereLight(0x87CEEB,0x4a7c34,0.35));
gnd();bord();gard();flw();butt();clouds();snake();sheadCam();
for(var i=0;i<3;i++) spawnFr();
clk=new THREE.Clock();
addEventListener('resize',rsz);inp();anim();
}
function el(id){return document.getElementById(id)}
function innerW(){return innerWidth}
function innerH(){return innerHeight}

function gnd(){
var cv=document.createElement('canvas');cv.width=512;cv.height=512;var cx=cv.getContext('2d');
cx.fillStyle='#4a7c34';cx.fillRect(0,0,512,512);
for(var i=0;i<5000;i++){var x=Math.random()*512,y=Math.random()*512,r=Math.random()*2.5;
cx.fillStyle=Math.random()>.5?'#3d6b2a':'#5a8c44';cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();}
for(var i=0;i<25;i++){var x=Math.random()*512,y=Math.random()*512,r=15+Math.random()*35;
cx.fillStyle='rgba(55,95,45,.25)';cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();}
var t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,8);
var g=new THREE.Mesh(new THREE.PlaneGeometry(gs*2,gs*2),new THREE.MeshLambertMaterial({map:t}));
g.rotation.x=-1.5708;g.receiveShadow=true;S.add(g);
}

function bord(){
var m=new THREE.MeshLambertMaterial({color:0x2d5a1e});
var g=new THREE.BoxGeometry(gs*2,1.6,0.5);
[[0,0.8,gs],[0,0.8,-gs],[gs,0.8,0],[-gs,0.8,0]].forEach(function(p,i){
var h=new THREE.Mesh(g,m);h.position.set(p[0],p[1],p[2]);
if(i>1)h.rotation.y=1.5708;h.castShadow=true;h.receiveShadow=true;S.add(h);});
}

function gard(){
for(var i=0;i<8;i++){var a=(i/8)*6.283+Math.random()*.3,r=gs-3-Math.random()*2;
mkTree(Math.cos(a)*r,Math.sin(a)*r);}
for(var i=0;i<4;i++){var x,z,ok;do{x=(Math.random()-.5)*(gs-10);z=(Math.random()-.5)*(gs-10);
ok=Math.sqrt(x*x+z*z)>6;}while(!ok);mkTree(x,z);}
for(var i=0;i<12;i++){var x,z,ok;do{x=(Math.random()-.5)*(gs-6);z=(Math.random()-.5)*(gs-6);
ok=Math.sqrt(x*x+z*z)>5;}while(!ok);mkBush(x,z);}
}

function mkTree(x,z){
var g=new THREE.Group();
var tk=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.35,2.5,6),new THREE.MeshLambertMaterial({color:0x6b4226}));
tk.position.y=1.25;tk.castShadow=true;g.add(tk);
var fc=0x2d5a1e+Math.floor(Math.random()*0x0a1a0a);
var fm=new THREE.MeshLambertMaterial({color:fc});
var f1=new THREE.Mesh(new THREE.SphereGeometry(1.3+Math.random()*.3,8,6),fm);f1.position.y=3;f1.castShadow=true;g.add(f1);
var f2=new THREE.Mesh(new THREE.SphereGeometry(0.9,6,5),fm);f2.position.set(0.6,3.8,0.3);f2.castShadow=true;g.add(f2);
var f3=new THREE.Mesh(new THREE.SphereGeometry(0.9,6,5),fm);f3.position.set(-0.5,3.5,-0.4);f3.castShadow=true;g.add(f3);
g.position.set(x,0,z);S.add(g);tr.push({x:x,z:z,r:0.7});
}

function mkBush(x,z){
var g=new THREE.Group();var bm=new THREE.MeshLambertMaterial({color:0x3a6b2a});
for(var i=0;i<4;i++){var r=0.3+Math.random()*.25;
var b=new THREE.Mesh(new THREE.SphereGeometry(r,6,5),bm);
b.position.set((Math.random()-.5)*.7,r*.7,(Math.random()-.5)*.7);b.castShadow=true;g.add(b);}
g.position.set(x,0,z);S.add(g);bu.push({x:x,z:z,r:0.6});
}

function flw(){
var cl=[0xff6b9d,0xffeb3b,0xff5722,0xe1bee7,0xffffff,0xff4081];
for(var i=0;i<70;i++){
var x=(Math.random()-.5)*(gs-2)*2,z=(Math.random()-.5)*(gs-2)*2;
if(Math.abs(x)>gs-1||Math.abs(z)>gs-1)continue;
var f=new THREE.Mesh(new THREE.SphereGeometry(0.08,5,4),new THREE.MeshBasicMaterial({color:cl[Math.floor(Math.random()*cl.length)]}));
f.position.set(x,0.08,z);S.add(f);
}
//grass tufts
var gm=new THREE.MeshLambertMaterial({color:0x5a8c44,side:THREE.DoubleSide});
for(var i=0;i<100;i++){var x=(Math.random()-.5)*(gs-2)*2,z=(Math.random()-.5)*(gs-2)*2;
if(Math.abs(x)>gs-1||Math.abs(z)>gs-1)continue;
var b=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.22+Math.random()*.1,3),gm);
b.position.set(x,0.11,z);b.rotation.set((Math.random()-.5)*.3,Math.random()*6.283,(Math.random()-.5)*.3);S.add(b);}
}

function butt(){
var cl=[0xff6b9d,0xffeb3b,0x4fc3f7,0xba68c8,0xff8a65,0xaed581];
for(var i=0;i<6;i++){
var g=new THREE.Group();var c=cl[i%cl.length];
var bm=new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide});
var wg=new THREE.CircleGeometry(0.12,5);
var w1=new THREE.Mesh(wg,bm);w1.position.x=0.1;g.add(w1);
var w2=new THREE.Mesh(wg,bm);w2.position.x=-0.1;w2.rotation.y=Math.PI;g.add(w2);
var x=(Math.random()-.5)*gs,z=(Math.random()-.5)*gs;
g.position.set(x,1+Math.random()*2,z);S.add(g);
bf.push({m:g,w1:w1,w2:w2,a:Math.random()*6.283,s:0.02+Math.random()*.02,yb:g.position.y,ph:Math.random()*6.283});
}
}

function clouds(){
var cm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7});
for(var i=0;i<8;i++){var g=new THREE.Group();
for(var j=0;j<4;j++){var s=new THREE.Mesh(new THREE.SphereGeometry(1.5+Math.random(),6,5),cm);
s.position.set((Math.random()-.5)*4,Math.random()*.5,(Math.random()-.5)*4);g.add(s);}
g.position.set((Math.random()-.5)*55,14+Math.random()*6,(Math.random()-.5)*55);S.add(g);}
}

function snake(){
shead=[];
for(var i=0;i<200;i++){
var ev=i%2===0;
var m=new THREE.MeshLambertMaterial({color:ev?0x4caf50:0x388e3c});
var r=Math.max(0.05,0.22-i*0.0008);
var ms=new THREE.Mesh(new THREE.SphereGeometry(r,6,5),m);
ms.castShadow=true;ms.visible=false;S.add(ms);shead.push(ms);
}
}

function sheadCam(){
var g=new THREE.Group();
var sn=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),new THREE.MeshLambertMaterial({color:0x4caf50}));
sn.scale.set(1,0.7,1.5);sn.position.set(0,-0.25,-0.35);g.add(sn);
var em=new THREE.MeshBasicMaterial({color:0xffd700}),eg=new THREE.SphereGeometry(0.04,6,5);
var eL=new THREE.Mesh(eg,em);eL.position.set(-0.09,-0.18,-0.38);g.add(eL);
var eR=new THREE.Mesh(eg,em);eR.position.set(0.09,-0.18,-0.38);g.add(eR);
var pm=new THREE.MeshBasicMaterial({color:0x000000}),pg=new THREE.SphereGeometry(0.02,5,4);
var pL=new THREE.Mesh(pg,pm);pL.position.set(-0.09,-0.18,-0.42);g.add(pL);
var pR=new THREE.Mesh(pg,pm);pR.position.set(0.09,-0.18,-0.42);g.add(pR);
var tg=new THREE.PlaneGeometry(0.04,0.15);tg.translate(0,-0.075,0);
tm=new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:0xff1744,side:THREE.DoubleSide}));
tm.position.set(0,-0.28,-0.5);tm.visible=false;g.add(tm);
C.add(g);S.add(C);
}

function spawnFr(){
var x,z,ok,at=0;
do{x=(Math.random()-.5)*(gs-4);z=(Math.random()-.5)*(gs-4);ok=true;
for(var i=0;i<tr.length;i++){if(Math.sqrt((x-tr[i].x)**2+(z-tr[i].z)**2)<2){ok=false;break;}}
if(ok)for(var i=0;i<bu.length;i++){if(Math.sqrt((x-bu[i].x)**2+(z-bu[i].z)**2)<1.5){ok=false;break;}}
if(ok&&Math.sqrt((x-hp.x)**2+(z-hp.z)**2)<4)ok=false;at++;}while(!ok&&at<50);
var r=Math.random(),ti;
if(r<0.05&&lv>=2)ti=4;else if(r<0.2)ti=3;else if(r<0.4)ti=2;else if(r<0.7)ti=1;else ti=0;
var t=FT[ti];var g=new THREE.Group();
var fm=new THREE.MeshLambertMaterial({color:t.c,emissive:t.c,emissiveIntensity:0.2});
var f=new THREE.Mesh(new THREE.SphereGeometry(0.25,10,8),fm);f.castShadow=true;g.add(f);
var gl=new THREE.Mesh(new THREE.SphereGeometry(0.4,8,6),new THREE.MeshBasicMaterial({color:t.c,transparent:true,opacity:0.2}));g.add(gl);
var st=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.03,0.15,5),new THREE.MeshLambertMaterial({color:0x4a3520}));st.position.y=0.25;g.add(st);
var lg=new THREE.SphereGeometry(0.08,5,4);lg.scale(1,0.3,0.6);
var lf=new THREE.Mesh(lg,new THREE.MeshLambertMaterial({color:0x4caf50}));lf.position.set(0.06,0.28,0);lf.rotation.z=-0.5;g.add(lf);
g.position.set(x,0.4,z);S.add(g);
fr.push({m:g,gl:gl,x:x,z:z,t:t,bob:Math.random()*6.283,spin:0});
}

function inp(){
var lz=el('lz'),rz=el('rz');
lz.addEventListener('touchstart',function(e){e.preventDefault();tl=true;},false);
lz.addEventListener('touchend',function(e){e.preventDefault();tl=false;},false);
rz.addEventListener('touchstart',function(e){e.preventDefault();tr2=true;},false);
rz.addEventListener('touchend',function(e){e.preventDefault();tr2=false;},false);
lz.addEventListener('mousedown',function(){tl=true;});
lz.addEventListener('mouseup',function(){tl=false;});
rz.addEventListener('mousedown',function(){tr2=true;});
rz.addEventListener('mouseup',function(){tr2=false;});
document.addEventListener('touchcancel',function(){tl=false;tr2=false;},false);
addEventListener('keydown',function(e){if(e.key=='ArrowLeft'||e.key=='a'||e.key=='A')tl=true;if(e.key=='ArrowRight'||e.key=='d'||e.key=='D')tr2=true;});
addEventListener('keyup',function(e){if(e.key=='ArrowLeft'||e.key=='a'||e.key=='A')tl=false;if(e.key=='ArrowRight'||e.key=='d'||e.key=='D')tr2=false;});
el('sb').addEventListener('click',start);
el('rb').addEventListener('click',start);
}

function start(){
sc=0;lv=1;fe=0;spd=bsp;h=0;hp={x:0,z:0};bl=5;pth=[];tl=false;tr2=false;shk=0;
fr.forEach(function(f){S.remove(f.m);});fr=[];
ptc.forEach(function(p){S.remove(p.m);});ptc=[];
for(var i=0;i<3;i++) spawnFr();
shead.forEach(function(m){m.visible=false;});
el('menu').style.display='none';el('go').style.display='none';
el('hud').style.display='block';el('comp').style.display='block';
el('lz').style.display='block';el('rz').style.display='block';el('th').style.display='flex';
updHUD();G='playing';
}

function gover(){
G='gameover';
if(sc>hi){hi=sc;localStorage.setItem('s3d_hi',hi);}
el('fs').textContent=sc;el('hs').textContent=hi;
el('go').style.display='flex';el('hud').style.display='none';
el('comp').style.display='none';el('lz').style.display='none';el('rz').style.display='none';el('th').style.display='none';
snd('go');shk=1;if(navigator.vibrate)navigator.vibrate([100,50,200]);
}

function updHUD(){
el('sc').textContent=sc;el('lv').textContent=lv;el('sp').textContent=(spd/bsp).toFixed(1);
}

function updComp(){
if(fr.length===0)return;
var n=fr[0],md=1e9;
for(var i=0;i<fr.length;i++){var d=(fr[i].x-hp.x)**2+(fr[i].z-hp.z)**2;if(d<md){md=d;n=fr[i];}}
var dx=n.x-hp.x,dz=n.z-hp.z;
var fa=Math.atan2(dx,-dz),df=fa-h;
while(df>3.1416)df-=6.2832;while(df<-3.1416)df+=6.2832;
el('ca').setAttribute('transform','rotate('+(df*180/3.1416)+' 23 23)');
}

function snd(t){
try{if(!actx)actx=new(AudioContext||webkitAudioContext)();
var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
if(t=='eat'){o.frequency.setValueAtTime(440,actx.currentTime);
o.frequency.exponentialRampToValueAtTime(880,actx.currentTime+0.1);
g.gain.setValueAtTime(0.25,actx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.2);o.start();o.stop(actx.currentTime+0.2);}
else if(t=='gold'){o.frequency.setValueAtTime(660,actx.currentTime);
o.frequency.exponentialRampToValueAtTime(1320,actx.currentTime+0.15);
g.gain.setValueAtTime(0.25,actx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.3);o.start();o.stop(actx.currentTime+0.3);}
else if(t=='go'){o.frequency.setValueAtTime(220,actx.currentTime);
o.frequency.exponentialRampToValueAtTime(55,actx.currentTime+0.5);
g.gain.setValueAtTime(0.3,actx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.6);
o.type='sawtooth';o.start();o.stop(actx.currentTime+0.6);}
else if(t=='lv'){for(var i=0;i<3;i++){var o2=actx.createOscillator(),g2=actx.createGain();
o2.connect(g2);g2.connect(actx.destination);
o2.frequency.setValueAtTime(440*(i+1),actx.currentTime+i*0.1);
g2.gain.setValueAtTime(0.2,actx.currentTime+i*0.1);
g2.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*0.1+0.15);
o2.start(actx.currentTime+i*0.1);o2.stop(actx.currentTime+i*0.1+0.15);}}
}catch(e){}
}

function mkPart(x,y,z,c){
for(var i=0;i<12;i++){
var p=new THREE.Mesh(new THREE.SphereGeometry(0.05,4,3),new THREE.MeshBasicMaterial({color:c,transparent:true}));
p.position.set(x,y,z);S.add(p);
ptc.push({m:p,vx:(Math.random()-.5)*0.15,vy:Math.random()*0.15+0.05,vz:(Math.random()-.5)*0.15,life:1});
}
}

function showPop(pts){
var d=document.createElement('div');d.className='sp';d.textContent='+'+pts;
d.style.left='50%';d.style.top='38%';d.style.transform='translateX(-50%)';
document.body.appendChild(d);
var op=1,py=38;var iv=setInterval(function(){op-=0.03;py-=1;
d.style.opacity=op;d.style.top=py+'%';if(op<=0){clearInterval(iv);d.remove();}},16);
}

function anim(){
requestAnimationFrame(anim);
var dt=Math.min(clk.getDelta(),0.05);
if(G==='playing')update(dt);
else if(G==='menu'){var t=clk.getElapsedTime();
C.position.x=Math.cos(t*0.15)*12;C.position.z=Math.sin(t*0.15)*12;C.position.y=7;C.lookAt(0,0,0);}
updButt(dt);updPart(dt);
if(G==='gameover'&&shk>0){
C.position.x+=(Math.random()-.5)*shk*0.3;C.position.y+=(Math.random()-.5)*shk*0.3;
shk*=0.9;if(shk<0.01)shk=0;}
R.render(S,C);
}

function update(dt){
var df=dt*60;
if(tl)h+=trn*df;
if(tr2)h-=trn*df;
var dx=Math.sin(h)*spd*df,dz=-Math.cos(h)*spd*df;
hp.x+=dx;hp.z+=dz;
pth.unshift({x:hp.x,z:hp.z});if(pth.length>2000)pth.length=2000;

for(var i=0;i<bl&&i<shead.length;i++){
var td=(i+1)*ss,pl=false,ac=0;
for(var j=0;j<pth.length-1;j++){
var sdx=pth[j].x-pth[j+1].x,sdz=pth[j].z-pth[j+1].z;
var sl=Math.sqrt(sdx*sdx+sdz*sdz);if(sl<0.0001)continue;
if(ac+sl>=td){var tt=(td-ac)/sl;
shead[i].position.x=pth[j+1].x+sdx*tt;
shead[i].position.z=pth[j+1].z+sdz*tt;
shead[i].position.y=0.2;shead[i].visible=true;pl=true;break;}
ac+=sl;}
if(!pl&&pth.length>0){var ls=pth[pth.length-1];shead[i].position.set(ls.x,0.2,ls.z);shead[i].visible=true;}
}
for(var i=bl;i<shead.length;i++)shead[i].visible=false;

var bob=Math.sin(clk.getElapsedTime()*8)*0.03;
C.position.set(hp.x,0.9+bob,hp.z);
C.lookAt(hp.x+Math.sin(h)*8,0.1,hp.z-Math.cos(h)*8);

//tongue
tt+=dt;if(tt>3){tt=0;tm.visible=true;tm.scale.y=0;}
if(tm.visible){var tp=tt/0.3;if(tp<1)tm.scale.y=tp;else if(tp<2)tm.scale.y=2-tp;else tm.visible=false;}

//fruit
for(var i=fr.length-1;i>=0;i--){
var f=fr[i];var d=Math.sqrt((f.x-hp.x)**2+(f.z-hp.z)**2);
if(d<0.6){
sc+=f.t.p;bl+=2;fe++;spd=bsp+fe*0.003;
mkPart(f.x,0.4,f.z,f.t.c);showPop(f.t.p);
if(navigator.vibrate)navigator.vibrate(30);
snd(f.t===FT[4]?'gold':'eat');
S.remove(f.m);fr.splice(i,1);spawnFr();
if(fe%5===0){lv++;snd('lv');if(lv<=5)addObs();}
updHUD();}
f.bob+=dt*3;f.m.position.y=0.4+Math.sin(f.bob)*0.1;f.spin+=dt*1.5;f.m.rotation.y=f.spin;
f.gl.scale.setScalar(1+Math.sin(f.bob*2)*0.15);
}

//boundary
if(Math.abs(hp.x)>gs-1||Math.abs(hp.z)>gs-1){gover();return;}
//trees
for(var i=0;i<tr.length;i++){var d=Math.sqrt((tr[i].x-hp.x)**2+(tr[i].z-hp.z)**2);
if(d<tr[i].r+0.3){gover();return;}}
//bushes
for(var i=0;i<bu.length;i++){var d=Math.sqrt((bu[i].x-hp.x)**2+(bu[i].z-hp.z)**2);
if(d<bu[i].r+0.3){gover();return;}}
//self
for(var i=8;i<bl&&i<shead.length;i++){
if(!shead[i].visible)continue;
var d=Math.sqrt((shead[i].position.x-hp.x)**2+(shead[i].position.z-hp.z)**2);
if(d<0.3){gover();return;}}
updComp();
}

function addObs(){
var x,z,ok,at=0;
do{x=(Math.random()-.5)*(gs-8);z=(Math.random()-.5)*(gs-8);
ok=Math.sqrt((x-hp.x)**2+(z-hp.z)**2)>8;
if(ok)for(var i=0;i<tr.length;i++){if(Math.sqrt((x-tr[i].x)**2+(z-tr[i].z)**2)<3){ok=false;break;}}
at++;}while(!ok&&at<30);
if(ok)mkBush(x,z);
}

function updButt(dt){
for(var i=0;i<bf.length;i++){
var b=bf[i];b.a+=b.s*dt*60;
b.m.position.x+=Math.cos(b.a)*0.03;b.m.position.z+=Math.sin(b.a)*0.03;
b.m.position.y=b.yb+Math.sin(b.ph+b.a*0.5)*0.3;
if(Math.abs(b.m.position.x)>gs-1)b.m.position.x*=-0.99;
if(Math.abs(b.m.position.z)>gs-1)b.m.position.z*=-0.99;
b.m.lookAt(b.m.position.x+Math.cos(b.a)*5,b.m.position.y,b.m.position.z+Math.sin(b.a)*5);
var fl=Math.sin(b.a*20)*0.5+0.5;b.w1.rotation.y=fl;b.w2.rotation.y=Math.PI-fl;
}
}

function updPart(dt){
for(var i=ptc.length-1;i>=0;i--){var p=ptc[i];
p.m.position.x+=p.vx;p.m.position.y+=p.vy;p.m.position.z+=p.vz;
p.vy-=0.01;p.life-=dt*1.5;p.m.material.opacity=Math.max(0,p.life);
if(p.life<=0){S.remove(p.m);ptc.splice(i,1);}}
}

function rsz(){C.aspect=innerW()/innerH();C.updateProjectionMatrix();R.setSize(innerW(),innerH());}

init();
</script>
