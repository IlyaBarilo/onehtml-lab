<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Реакция на пробел</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#164a68;color:white;font:16px system-ui,sans-serif}.pad{display:grid;place-items:center;width:100vw;height:100vh;height:100dvh;border:0;background:#164a68;color:white;text-align:center;cursor:pointer}.pad.waiting{background:#b77b29}.pad.ready{background:#208f6b}.pad.result{background:#285e9e}.center{padding:24px}h1{margin:0 0 16px;font-size:clamp(34px,6vw,74px)}.message{display:block;font-size:clamp(22px,3vw,38px);font-weight:700}.hint{display:block;margin-top:20px;font-size:16px;font-weight:400;opacity:.85}.best{position:absolute;right:28px;bottom:24px;font-size:18px;font-weight:700;pointer-events:none}
</style>
</head>
<body>
<button id="pad" class="pad"><span class="center"><h1>Реакция на пробел</h1><span class="message" id="message">Пробел — начать</span><span class="hint">Дождитесь зелёного цвета и нажмите пробел. Можно также щёлкнуть мышью.</span></span></button><div class="best" id="best">Лучший результат: —</div>
<script>
const pad=document.querySelector('#pad'),message=document.querySelector('#message'),best=document.querySelector('#best');let state='idle',timer,started,record=Infinity;
function action(){if(state==='waiting'){clearTimeout(timer);state='idle';pad.className='pad';message.textContent='Рано! Попробуйте снова';return}if(state==='ready'){const elapsed=Math.round(performance.now()-started);record=Math.min(record,elapsed);best.textContent='Лучший результат: '+record+' мс';state='result';pad.className='pad result';message.textContent=elapsed+' мс — ещё раз';return}state='waiting';pad.className='pad waiting';message.textContent='Ждите зелёного…';timer=setTimeout(()=>{state='ready';started=performance.now();pad.className='pad ready';message.textContent='Нажмите пробел!'},1500+Math.random()*2500)}
pad.onclick=action;addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat){event.preventDefault();action()}});
</script>
</body>
</html>
