<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-модель GLB</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#132239;color:#edf4ff;font:16px system-ui,sans-serif}
body{display:flex;flex-direction:column}header,footer{padding:10px 14px;background:#192c46;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:19px;margin:0}header p{font-size:14px;margin:0;color:#b4c8df}main{flex:1;min-height:0;position:relative;touch-action:none}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;color:#c3d5ec;font-size:14px}button{font:inherit;color:inherit;background:#244262;border:1px solid #597da1;border-radius:8px;min-height:44px;padding:8px 12px;cursor:pointer}button[aria-pressed="true"]{background:#345d89}footer{font-size:14px}footer label{display:flex;align-items:center;gap:8px}input{width:100px}#reset{margin-left:auto}@media(max-width:450px){header,footer{padding:8px;gap:6px}header p{width:100%}button{padding:6px 9px;font-size:14px}footer label{width:100%}input{flex:1}#reset{margin-left:0}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<header><h1>3D-модель GLB</h1><p>Вращайте касанием или мышью. Геометрия, текстура и анимация — внутри модели.</p></header>
<main id="stage"><div id="status" role="status">Загрузка модели…</div></main>
<footer><button id="animation" aria-pressed="true">Анимация</button><button id="rotation" aria-pressed="false">Вращение</button><button id="reset">Сброс вида</button><label>Масштаб <input id="zoom" type="range" min="70" max="180" value="100"></label></footer>
<div id="model-source" data-model-src="satellite.glb" hidden></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),zoom=document.querySelector('#zoom');
let renderer,mixer,model,scene,camera,baseDistance=5,yaw=.55,pitch=.3,drag=null,animate=true,rotate=false,disposed=false;
try {
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
  stage.append(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color('#132239');
  scene.add(new THREE.HemisphereLight(0xd3e5ff,0x33435c,2));const light=new THREE.DirectionalLight(0xffefdc,3);light.position.set(4,6,5);scene.add(light);
  camera=new THREE.PerspectiveCamera(40,1,.01,1000);
  const gltf=await new GLTFLoader().loadAsync(document.querySelector('#model-source').getAttribute('data-model-src'));
  model=gltf.scene;const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
  model.position.sub(center);scene.add(model);baseDistance=Math.max(size.x,size.y,size.z)*1.6;
  if(gltf.animations.length){mixer=new THREE.AnimationMixer(model);for(const clip of gltf.animations)mixer.clipAction(clip).play();}
  else document.querySelector('#animation').disabled=true;
  status.textContent='Спутник · '+gltf.animations.length+' анимация';stage.dataset.loaded='true';
  function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
  const observer=new ResizeObserver(resize);observer.observe(stage);resize();
  let previous=performance.now();
  function frame(now){if(disposed)return;requestAnimationFrame(frame);const delta=Math.min((now-previous)/1000,.1);previous=now;
    if(animate)mixer?.update(delta);if(rotate&&!drag)yaw+=delta*.22;
    const distance=baseDistance*(100/Number(zoom.value))*Math.max(1,1/camera.aspect);
    camera.position.set(Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(0,0,0);renderer.render(scene,camera);
  }requestAnimationFrame(frame);
  stage.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId);});
  stage.addEventListener('pointermove',e=>{if(drag?.id!==e.pointerId)return;yaw+=(e.clientX-drag.x)*.008;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag.y)*.008));drag.x=e.clientX;drag.y=e.clientY;});
  for(const name of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(name,()=>{drag=null;});
  document.querySelector('#animation').onclick=e=>{animate=!animate;e.currentTarget.setAttribute('aria-pressed',String(animate));};
  document.querySelector('#rotation').onclick=e=>{rotate=!rotate;e.currentTarget.setAttribute('aria-pressed',String(rotate));};
  document.querySelector('#reset').onclick=()=>{yaw=.55;pitch=.3;zoom.value='100';};
  addEventListener('pagehide',()=>{disposed=true;observer.disconnect();mixer?.stopAllAction();const textures=new Set();model.traverse(item=>{item.geometry?.dispose();for(const material of [].concat(item.material||[])){for(const value of Object.values(material))if(value?.isTexture)textures.add(value);material.dispose();}});for(const texture of textures){texture.image?.close?.();texture.dispose();}renderer.dispose();},{once:true});
}catch(error){status.textContent='Модель не загружена: '+error.message;status.style.color='#ffc7c7';}
</script>
</body>
</html>
