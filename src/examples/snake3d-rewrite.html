<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Змейка 3D — Сад</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#c{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:env(safe-area-inset-top,8px) 12px 8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.hud-box{background:rgba(0,0,0,.45);color:#fff;padding:6px 12px;border-radius:10px;font-size:13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:60px;text-align:center}
.hud-box b{font-size:18px;display:block;line-height:1.1}
#compass{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;width:100px;height:100px}
#compass svg{width:100%;height:100%}
#ctrl{position:fixed;bottom:0;left:0;right:0;height:50%;z-index:5}
#ctrlL{left:0;width:50%}
#ctrlR{right:0;width:50%}
.ctrl-half{position:fixed;bottom:0;height:50%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,20px);font-size:48px;color:rgba(255,255,255,.3);pointer-events:none;transition:color .12s,background .12s}
.ctrl-half.active{color:rgba(255,255,255,.7);background:linear-gradient(0deg,rgba(255,255,255,.08),transparent)}
.ctrl-half svg{opacity:.35;width:52px;height:52px;margin-bottom:6px}
.ctrl-half.active svg{opacity:.7}
#menu{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(20,60,30,.92),rgba(10,30,15,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:20px;text-align:center}
#menu h1{font-size:42px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.6);margin-bottom:6px;letter-spacing:1px}
#menu p{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:20px;max-width:340px;line-height:1.6}
#menu p .key{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:5px;font-size:12px}
.btn{background:linear-gradient(135deg,#4CAF50,#388E3C);color:#fff;border:none;padding:14px 40px;font-size:20px;border-radius:30px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.3);transition:transform .15s;font-weight:600}
.btn:active{transform:scale(.94)}
.inv-toggle{margin-top:16px;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.inv-toggle input{width:18px;height:18px;accent-color:#4CAF50}
#over{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:20px;text-align:center}
#over h2{font-size:36px;color:#ff5252;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#over p{color:rgba(255,255,255,.8);font-size:16px;margin-bottom:6px}
#over .score-final{font-size:24px;color:#FFD700;margin-bottom:4px}
#over .record{font-size:14px;color:rgba(255,255,255,.5)}
#toast{position:fixed;bottom:52%;left:50%;transform:translate(-50%,0);background:rgba(0,0,0,.55);color:#fff;padding:6px 16px;border-radius:8px;font-size:14px;z-index:15;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-30px)}
#fps{position:fixed;bottom:env(safe-area-inset-bottom,4px);left:4px;font-size:10px;color:rgba(255,255,255,.3);z-index:10;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div class="hud-box">Очки<b id="score">0</b></div>
<div class="hud-box">Ур.<b id="level">1</b></div>
<div class="hud-box">Длина<b id="length">3</b></div>
</div>
<div id="compass">
<svg viewBox="-55 -55 110 110">
<circle cx="0" cy="0" r="50" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="-38" stroke="#4CAF50" stroke-width="3" stroke-linecap="round" id="needle"/>
<circle cx="0" cy="0" r="4" fill="#4CAF50"/>
<text x="0" y="-40" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.6)">фрукт</text>
</svg>
</div>
<div id="ctrl">
<div id="ctrlL" class="ctrl-half">
<svg viewBox="0 0 48 48"><path d="M40 24 L14 24 M14 24 L24 14 M14 24 L24 34" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div id="ctrlR" class="ctrl-half">
<svg viewBox="0 0 48 48"><path d="M8 24 L34 24 M34 24 L24 14 M34 24 L24 34" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</div>
<div id="toast"></div>
<div id="fps"></div>
<div id="menu">
<h1>🐍 Змейка 3D</h1>
<p>Просыпайся в саду! Ползи от первого лица и собирай фрукты.<br><br>Нажимай <span class="key">влево</span> или <span class="key">вправо</span> на экране чтобы поворачивать. На компьютере — <span class="key">A</span> / <span class="key">D</span> или стрелки.<br>Не врезайся в деревья, кусты и забор!</p>
<button class="btn" id="startBtn">Старт</button>
<label class="inv-toggle"><input type="checkbox" id="invChk"> Инвертировать поворот</label>
</div>
<div id="over">
<h2>Игра окончена</h2>
<p class="score-final">Очки: <span id="finalScore">0</span></p>
<p class="record">Рекорд: <span id="recordScore">0</span></p>
<button class="btn" id="retryBtn" style="margin-top:16px">Заново</button>
</div>
<script>
// ── Setup ──
const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,200);
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,22,55);

// ── Lights ──
const sun=new THREE.DirectionalLight(0xFFF4E0,.85);
sun.position.set(15,25,10);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=1;sun.shadow.camera.far=60;
sun.shadow.camera.left=-20;sun.shadow.camera.right=20;
sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;
scene.add(sun);
const hemi=new THREE.HemisphereLight(0x87CEEB,0x4A7C2A,.45);
scene.add(hemi);
const amb=new THREE.AmbientLight(0x405060,.25);
scene.add(amb);

// ── Ground ──
const GARDEN=28;
const gc=document.createElement('canvas');gc.width=gc.height=256;
const gctx=gc.getContext('2d');
const ggd=gctx.createRadialGradient(128,128,20,128,128,180);
ggd.addColorStop(0,'#5a9e3a');ggd.addColorStop(1,'#3d7a25');
gctx.fillStyle=ggd;gctx.fillRect(0,0,256,256);
for(let i=0;i<4000;i++){gctx.fillStyle=`rgba(${30+Math.random()*40|0},${80+Math.random()*60|0},${20+Math.random()*30|0},.6)`;gctx.beginPath();gctx.arc(Math.random()*256,Math.random()*256,1+Math.random()*2,0,7);gctx.fill()}
const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(8,8);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(GARDEN,GARDEN),new THREE.MeshLambertMaterial({map:gt}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ── Fence ──
const fenceMat=new THREE.MeshLambertMaterial({color:0x8B6914});
const postMat=new THREE.MeshLambertMaterial({color:0xA0826D});
const half=GARDEN/2;
[[-half,half],[half,half],[half,-half],[-half,-half]].forEach(p=>{
const post=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,2,8),postMat);
post.position.set(p[0],1,p[1]);post.castShadow=true;scene.add(post);
});
[[-half,half],[half,half],[half,-half],[-half,-half]].forEach((p,i)=>{
const horiz=new THREE.Mesh(new THREE.BoxGeometry(i%2===0?GARDEN:.12,.15,.12),fenceMat);
if(i%2===0){horiz.position.set(0,.5,p[1])}else{horiz.position.set(p[0],.5,0)}
horiz.castShadow=true;scene.add(horiz);
const horiz2=horiz.clone();horiz2.position.y=1.1;scene.add(horiz2);
});
// decorative posts along fence
for(let i=-half+4;i<half;i+=4){
[[-half,i],[half,i],[i,half],[i,-half]].forEach(p=>{
const post=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,1.8,8),postMat);
post.position.set(p[0],.9,p[1]);post.castShadow=true;scene.add(post);
});
}

// ── Obstacles ──
const obstacles=[];
function makeTree(x,z){
const g=new THREE.Group();
const h=2+Math.random()*1.8;
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.32,h,8),new THREE.MeshLambertMaterial({color:0x5D4037}));
trunk.position.y=h/2;trunk.castShadow=true;g.add(trunk);
const col=['#2E7D32','#388E3C','#43A047'][Math.random()*3|0];
for(let i=0;i<3;i++){
const r=.8+Math.random()*.6;
const ball=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),new THREE.MeshLambertMaterial({color:col,flatShading:true}));
ball.position.set((Math.random()-.5)*.5,h+i*.6+(i===0?.3:0),(Math.random()-.5)*.5);
ball.castShadow=true;g.add(ball);
}
g.position.set(x,0,z);scene.add(g);
obstacles.push({x,z,r:.45});
}
function makeBush(x,z,scale){
scale=scale||1;
const g=new THREE.Group();
const col=['#2E7D32','#388E3C','#1B5E20'][Math.random()*3|0];
for(let i=0;i<4;i++){
const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.35+Math.random()*.25,1),new THREE.MeshLambertMaterial({color:col,flatShading:true}));
b.position.set((Math.random()-.5)*.5, .15+Math.random()*.25,(Math.random()-.5)*.5);
b.scale.setScalar(scale);b.castShadow=true;g.add(b);
}
g.position.set(x,0,z);scene.add(g);
obstacles.push({x,z,r:.4*scale});
}
function makeFlower(x,z){
const cols=['#E91E63','#FF5722','#FFC107','#9C27B0','#FFFFFF'];
const g=new THREE.Group();
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.4,4),new THREE.MeshLambertMaterial({color:0x2E7D32}));
stem.position.y=.2;g.add(stem);
const head=new THREE.Mesh(new THREE.SphereGeometry(.1,6,5),new THREE.MeshLambertMaterial({color:cols[Math.random()*cols.length|0]}));
head.position.y=.42;g.add(head);
g.position.set(x,0,z);scene.add(g);
}

// Place trees & bushes around edges
const placed=[];
function farEnough(x,z,min){return placed.every(p=>Math.hypot(p.x-x,p.z-z)>min)}
for(let i=0;i<14;i++){
let x,z,tries=0;
do{x=(Math.random()-.5)*(GARDEN-3);z=(Math.random()-.5)*(GARDEN-3);tries++}while(!farEnough(x,z,3)&&tries<30);
placed.push({x,z});makeTree(x,z);
}
for(let i=0;i<10;i++){
let x,z,tries=0;
do{x=(Math.random()-.5)*(GARDEN-2);z=(Math.random()-.5)*(GARDEN-2);tries++}while(!farEnough(x,z,2)&&tries<30);
placed.push({x,z});makeBush(x,z,.8+Math.random()*.5);
}
// flowers
for(let i=0;i<40;i++){const x=(Math.random()-.5)*(GARDEN-1),z=(Math.random()-.5)*(GARDEN-1);makeFlower(x,z)}

// ── Butterflies ──
const butterflies=[];
for(let i=0;i<6;i++){
const g=new THREE.Group();
const col=['#FF6B6B','#4ECDC4','#FFE66D','#95E1D3','#F38181'][i%5];
for(let s=-1;s<=1;s+=2){
const w=new THREE.Mesh(new THREE.CircleGeometry(.15,5),new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide}));
w.position.x=s*.12;g.add(w);
}
g.position.set((Math.random()-.5)*GARDEN,1.2+Math.random()*.8,(Math.random()-.5)*GARDEN);
scene.add(g);
butterflies.push({mesh:g,phase:Math.random()*7,baseY:g.position.y});
}

// ── Clouds ──
const clouds=[];
for(let i=0;i<5;i++){
const g=new THREE.Group();
const m=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7});
for(let j=0;j<4;j++){const c=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*.8,6,5),m);c.position.set(j*.8,Math.random()*.3,0);g.add(c)}
g.position.set((Math.random()-.5)*60,18+Math.random()*5,(Math.random()-.5)*40);
scene.add(g);clouds.push({mesh:g,speed:.01+Math.random()*.02});
}

// ── Snake ──
const snake={x:0,z:0,angle:0,speed:3.5,turnSpeed:1.6,segments:[],bodyLen:3,path:[],segSpacing:.3,headSize:.3,alive:false};
const headGroup=new THREE.Group();

// snake head mesh: rounded shape with eyes and tongue
const headMat=new THREE.MeshLambertMaterial({color:0x66BB6A});
const headMesh=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),headMat);
headMesh.scale.set(1,.85,1.2);headMesh.castShadow=true;headGroup.add(headMesh);
// eyes
const eyeMat=new THREE.MeshBasicMaterial({color:0xFFD700});
const eyeGeo=new THREE.SphereGeometry(.06,8,6);
const eyeL=new THREE.Mesh(eyeGeo,eyeMat);eyeL.position.set(-.13,.12,.2);headGroup.add(eyeL);
const eyeR=new THREE.Mesh(eyeGeo,eyeMat);eyeR.position.set(.13,.12,.2);headGroup.add(eyeR);
const pupilMat=new THREE.MeshBasicMaterial({color:0x000000});
const pL=new THREE.Mesh(new THREE.SphereGeometry(.035,6,4),pupilMat);pL.position.set(-.13,.11,.25);headGroup.add(pL);
const pR=new THREE.Mesh(new THREE.SphereGeometry(.035,6,4),pupilMat);pR.position.set(.13,.11,.25);headGroup.add(pR);
// nostrils
const nL=new THREE.Mesh(new THREE.SphereGeometry(.025,6,4),pupilMat);nL.position.set(-.06,.02,.27);headGroup.add(nL);
const nR=new THREE.Mesh(new THREE.SphereGeometry(.025,6,4),pupilMat);nR.position.set(.06,.02,.27);headGroup.add(nR);
// tongue
const tonguePivot=new THREE.Group();tonguePivot.position.set(0,-.05,.2);headGroup.add(tonguePivot);
const tongue=new THREE.Mesh(new THREE.BoxGeometry(.04,.01,.22),new THREE.MeshBasicMaterial({color:0xE91E63}));
tongue.position.set(0,0,.11);tonguePivot.add(tongue);
const tForkL=new THREE.Mesh(new THREE.BoxGeometry(.015,.01,.06),new THREE.MeshBasicMaterial({color:0xE91E63}));
tForkL.position.set(-.02,0,.22);tonguePivot.add(tForkL);
const tForkR=new THREE.Mesh(new THREE.BoxGeometry(.015,.01,.06),new THREE.MeshBasicMaterial({color:0xE91E63}));
tForkR.position.set(.02,0,.22);tonguePivot.add(tForkR);
tonguePivot.visible=false;

scene.add(headGroup);

// body segments
const bodyMat=new THREE.MeshLambertMaterial({color:0x4CAF50});
const bodyGeo=new THREE.SphereGeometry(snake.headSize,8,6);

// ── Fruit ──
const fruits=[];
const fruitDefs=[
{name:'яблоко',color:0xE53935,points:10,r:.22,scale:1},
{name:'апельсин',color:0xFB8C00,points:15,r:.22,scale:1},
{name:'лимон',color:0xFDD835,points:20,r:.2,scale:.9},
{name:'виноград',color:0x8E24AA,points:25,r:.2,scale:.85},
{name:'золотой',color:0xFFD700,points:50,r:.25,scale:1.1,glow:true}
];
function spawnFruit(){
const type=snake.bodyLen>=8?fruitDefs[Math.random()<.15?4:Math.random()*4|0]:fruitDefs[Math.random()*4|0];
let x,z,ok=false,tries=0;
while(!ok&&tries<50){
x=(Math.random()-.5)*(GARDEN-3);z=(Math.random()-.5)*(GARDEN-3);
ok=obstacles.every(o=>Math.hypot(o.x-x,o.z-z)>1.2)&&Math.hypot(snake.x-x,snake.z-z)>2;
tries++;
}
if(!ok)return;
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.SphereGeometry(type.r,12,10),new THREE.MeshLambertMaterial({color:type.color,emissive:type.glow?type.color:0x000000,emissiveIntensity:type.glow?.4:0}));
body.scale.setScalar(type.scale);body.castShadow=true;g.add(body);
if(type.name==='яблоко'){const stem=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.1,4),new THREE.MeshLambertMaterial({color:0x5D4037}));stem.position.y=.25;g.add(stem)}
if(type.name==='виноград'){for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),new THREE.MeshLambertMaterial({color:type.color}));b.position.set((Math.random()-.5)*.2,.1-Math.random()*.15,(Math.random()-.5)*.2);g.add(b)}}
if(type.glow){const gl=new THREE.PointLight(type.color,.5,3);g.add(gl)}
g.position.set(x,.4,z);scene.add(g);
fruits.push({mesh:g,x,z,type,phase:Math.random()*7,baseY:.4});
}

// ── Particles ──
const particles=[];
function burst(x,y,z,color){
for(let i=0;i<12;i++){
const p=new THREE.Mesh(new THREE.SphereGeometry(.05,4,3),new THREE.MeshBasicMaterial({color,transparent:true}));
p.position.set(x,y,z);
const a=Math.random()*Math.PI*2,sp=2+Math.random()*2;
p.userData={vx:Math.cos(a)*sp,vy:1+Math.random()*2,vz:Math.sin(a)*sp,life:1};
scene.add(p);particles.push(p);
}
}

// ── Floating score text ──
const floatTexts=[];
function showFloatScore(x,y,z,text){
const cv=document.createElement('canvas');cv.width=128;cv.height=32;
const ctx=cv.getContext('2d');ctx.font='bold 20px system-ui';ctx.fillStyle='#FFD700';ctx.textAlign='center';
ctx.fillText(text,64,22);
const tex=new THREE.CanvasTexture(cv);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
sp.position.set(x,y+1,z);sp.scale.set(1.5,.4,1);scene.add(sp);
floatTexts.push({sprite:sp,life:1.5,vy:1.5});
}

// ── Audio ──
let actx;
function initAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(freq,dur,type,vol){
if(!actx)return;
type=type||'sine';vol=vol||.15;
const o=actx.createOscillator(),g=actx.createGain();
o.type=type;o.frequency.value=freq;g.gain.value=vol;
o.connect(g);g.connect(actx.destination);
o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
o.stop(actx.currentTime+dur);
}
function eatSound(type){const f={0:440,1:523,2:587,3:659,4:880};beep(f[type]||440,.15,'square',.12);setTimeout(()=>beep((f[type]||440)*1.5,.1,'square',.08),80)}
function levelUpSound(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.12),i*100))}
function crashSound(){beep(150,.3,'sawtooth',.2);setTimeout(()=>beep(80,.4,'sawtooth',.2),100)}

// ── Game State ──
let score=0,level=1,fruitsEaten=0,inverted=false;
const stored=+localStorage.getItem('snake3d_record')||0;

function reset(){
score=0;level=1;fruitsEaten=0;
snake.x=0;snake.z=0;snake.angle=0;snake.speed=3.5;snake.alive=true;
snake.bodyLen=3;snake.path=[];snake.segments=[];
headGroup.position.set(0,.5,0);
// remove old fruits
fruits.forEach(f=>scene.remove(f.mesh));fruits.length=0;
// remove obstacles added during previous game
for(let i=obstacles.length-1;i>=0;i--){if(obstacles[i].addedLater){obstacles.splice(i,1)}}
// remove old body segs
scene.children.forEach(c=>{if(c.userData&&c.userData.isBody)scene.remove(c)});
// spawn initial fruits
for(let i=0;i<3;i++)spawnFruit();
updateHUD();
}

function updateHUD(){
document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
document.getElementById('length').textContent=snake.bodyLen;
}

function gameOver(){
snake.alive=false;crashSound();
if(navigator.vibrate)navigator.vibrate([80,40,80]);
setTimeout(()=>{
document.getElementById('finalScore').textContent=score;
document.getElementById('recordScore').textContent=Math.max(score,stored);
if(score>stored){localStorage.setItem('snake3d_record',score)}
document.getElementById('over').style.display='flex';
},600);
}

// ── Controls ──
let turning=0; // -1 = left, 1 = right, 0 = none
const ctrlL=document.getElementById('ctrlL'),ctrlR=document.getElementById('ctrlR');

function press(side){return(e)=>{e.preventDefault();if(!snake.alive)return;turning=side;ctrlL.classList.toggle('active',side<0);ctrlR.classList.toggle('active',side>0)}}
function release(e){e.preventDefault();turning=0;ctrlL.classList.remove('active');ctrlR.classList.remove('active')}

ctrlL.addEventListener('touchstart',press(-1),{passive:false});
ctrlR.addEventListener('touchstart',press(1),{passive:false});
ctrlL.addEventListener('touchend',release,{passive:false});
ctrlR.addEventListener('touchend',release,{passive:false});
ctrlL.addEventListener('mousedown',press(-1));
ctrlR.addEventListener('mousedown',press(1));
document.addEventListener('mouseup',release);
document.addEventListener('keydown',e=>{
if(!snake.alive)return;
if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')turning=-1;
if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')turning=1;
});
document.addEventListener('keyup',e=>{turning=0});

// ── Menu ──
let menuCam=0;
document.getElementById('startBtn').onclick=()=>{
initAudio();
inverted=document.getElementById('invChk').checked;
document.getElementById('menu').style.display='none';
reset();
};
document.getElementById('retryBtn').onclick=()=>{
document.getElementById('over').style.display='none';
reset();
};

// ── Update Loop ──
const clock=new THREE.Clock();
let frameCount=0,fpsTime=0;
function update(){
requestAnimationFrame(update);
const dt=Math.min(clock.getDelta(),.05);
const time=clock.elapsedTime;

if(!snake.alive){
// menu camera orbit
menuCam+=dt*.15;
camera.position.set(Math.cos(menuCam)*14,8,Math.sin(menuCam)*14);
camera.lookAt(0,0,0);
renderer.render(scene,camera);
return;
}

// Turn: left press (-1) should turn LEFT (counter-clockwise => angle decreases)
// Right press (+1) should turn RIGHT (clockwise => angle increases)
// In inverted mode, flip it
let turn=turning;
if(inverted)turn=-turn;
snake.angle+=turn*snake.turnSpeed*dt;

// Move forward
const dx=Math.sin(snake.angle)*snake.speed*dt;
const dz=Math.cos(snake.angle)*snake.speed*dt;
snake.x+=dx;snake.z+=dz;

// Wall collision
const lim=GARDEN/2-.5;
if(Math.abs(snake.x)>lim||Math.abs(snake.z)>lim){snake.x=Math.max(-lim,Math.min(lim,snake.x));snake.z=Math.max(-lim,Math.min(lim,snake.z));gameOver();return}

// Obstacle collision
for(const o of obstacles){if(Math.hypot(o.x-snake.x,o.z-snake.z)<o.r+.3){gameOver();return}}

// Path recording
snake.path.push({x:snake.x,z:snake.z});
if(snake.path.length>500)snake.path.shift();

// Body segments: sample path at intervals
const totalDist=snake.path.length;
// place segments behind head
for(let i=snake.segments.length-1;i>=0;i--){scene.remove(snake.segments[i])}
snake.segments=[];
let distBehind=snake.segSpacing;
let pathIdx=snake.path.length-2;
let segCount=0;
while(pathIdx>0&&segCount<snake.bodyLen-1){
const p=snake.path[pathIdx];
const pp=snake.path[pathIdx+1];
const d=Math.hypot(pp.x-p.x,pp.z-p.z);
if(d>=.001){
distBehind-=d;
if(distBehind<=0){
const sm=new THREE.Mesh(bodyGeo,bodyMat);
sm.position.set(p.x,.4,p.z);sm.castShadow=true;sm.userData.isBody=true;scene.add(sm);
snake.segments.push(sm);
segCount++;
distBehind=snake.segSpacing;
}
}
pathIdx--;
}

// Self collision (skip first few segments near head)
for(let i=2;i<snake.segments.length;i++){
const s=snake.segments[i];
if(Math.hypot(s.position.x-snake.x,s.position.z-snake.z)<.35){gameOver();return}
}

// Head position & camera
headGroup.position.set(snake.x,.5,snake.z);
headGroup.rotation.y=snake.angle;
// Camera behind and above head, looking forward
const camOffX=-Math.sin(snake.angle)*.3;
const camOffZ=-Math.cos(snake.angle)*.3;
camera.position.set(snake.x+camOffX,.7,snake.z+camOffZ);
camera.lookAt(snake.x+Math.sin(snake.angle)*5,.5,snake.z+Math.cos(snake.angle)*5);
// Slight head bob
camera.position.y+=Math.sin(time*8)*.015;

// Tongue flicker
const tongueCycle=time%2.5;
tonguePivot.visible=tongueCycle>.2&&tongueCycle<.5;
if(tonguePivot.visible){tonguePivot.scale.z=1+(tongueCycle-.2)*2}

// Fruit: float & rotate & collect
let nearest=null,nearestD=Infinity;
for(let i=fruits.length-1;i>=0;i--){
const f=fruits[i];
f.mesh.position.y=f.baseY+Math.sin(time*2+f.phase)*.15;
f.mesh.rotation.y+=dt*1.5;
const d=Math.hypot(f.x-snake.x,f.z-snake.z);
if(d<.5){
score+=f.type.points;fruitsEaten++;
eatSound(fruitDefs.indexOf(f.type));
burst(f.mesh.position.x,f.mesh.position.y,f.mesh.position.z,f.type.color);
showFloatScore(f.x,f.baseY,f.z,'+'+f.type.points);
scene.remove(f.mesh);fruits.splice(i,1);
snake.bodyLen++;
snake.speed=Math.min(7,3.5+snake.bodyLen*.08);
if(navigator.vibrate)navigator.vibrate(30);
// level up every 5 fruits
if(fruitsEaten%5===0){
level++;levelUpSound();
if(navigator.vibrate)navigator.vibrate([50,30,50]);
// add a bush obstacle
let bx,bz,ok=false,tries=0;
while(!ok&&tries<20){bx=(Math.random()-.5)*(GARDEN-2);bz=(Math.random()-.5)*(GARDEN-2);ok=obstacles.every(o=>Math.hypot(o.x-bx,o.z-bz)>2)&&Math.hypot(snake.x-bx,snake.z-bz)>4;tries++}
if(ok){makeBush(bx,bz,.8+Math.random()*.4);obstacles[obstacles.length-1].addedLater=true}
showToast('Уровень '+level+'!');
}
updateHUD();
spawnFruit();
} else {
if(d<nearestD){nearestD=d;nearest=f}
}
}
// ensure at least 2 fruits on field
while(fruits.length<2)spawnFruit();

// Compass
if(nearest){
const angleToFruit=Math.atan2(nearest.x-snake.x,nearest.z-snake.z);
let rel=angleToFruit-snake.angle;
while(rel>Math.PI)rel-=Math.PI*2;
while(rel<-Math.PI)rel+=Math.PI*2;
document.getElementById('needle').setAttribute('transform',`rotate(${rel*180/Math.PI})`);
}

// Butterflies
butterflies.forEach(b=>{
b.phase+=dt*2;
b.mesh.position.x+=Math.sin(b.phase)*dt*1.5;
b.mesh.position.z+=Math.cos(b.phase*.7)*dt*1.5;
b.mesh.position.y=b.baseY+Math.sin(b.phase*2)*.2;
b.mesh.lookAt(b.mesh.position.x+Math.sin(b.phase+1),b.baseY,b.mesh.position.z+Math.cos(b.phase+1));
b.mesh.children.forEach(w=>{w.rotation.y=Math.sin(time*15+b.phase)*.6});
// keep in garden
if(Math.abs(b.mesh.position.x)>half-1)b.mesh.position.x*=-.95;
if(Math.abs(b.mesh.position.z)>half-1)b.mesh.position.z*=-.95;
});

// Clouds
clouds.forEach(c=>{c.mesh.position.x+=c.speed*dt*5;if(c.mesh.position.x>35)c.mesh.position.x=-35});

// Particles
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.position.x+=p.userData.vx*dt;
p.position.y+=p.userData.vy*dt;
p.position.z+=p.userData.vz*dt;
p.userData.vy-=5*dt;p.userData.life-=dt*1.5;
p.material.opacity=Math.max(0,p.userData.life);
if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}
}

// Float text
for(let i=floatTexts.length-1;i>=0;i--){
const t=floatTexts[i];
t.sprite.position.y+=t.vy*dt;
t.life-=dt;
t.sprite.material.opacity=Math.max(0,t.life/1.5);
if(t.life<=0){scene.remove(t.sprite);floatTexts.splice(i,1)}
}

// FPS
frameCount++;fpsTime+=dt;
if(fpsTime>1){document.getElementById('fps').textContent=Math.round(frameCount/fpsTime)+' FPS';frameCount=0;fpsTime=0}

renderer.render(scene,camera);
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}

// Resize
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// Prevent context menu on long press
document.addEventListener('contextmenu',e=>e.preventDefault());

update();
</script>
</body>
</html>
