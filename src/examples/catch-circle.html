<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поймай круг</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{color:#173b64;font:16px system-ui,sans-serif}main{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#ddecff}.field{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 25% 30%,#f7fbff 0,#ddecff 42%,#b9d7ff 100%);touch-action:manipulation}.top{position:absolute;z-index:1;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:max(16px,env(safe-area-inset-top)) 18px 12px;pointer-events:none}h1{margin:0;font-size:clamp(21px,6vw,30px)}.hint{margin:4px 0 0;font-size:13px}.info{display:flex;gap:16px;font-weight:700;white-space:nowrap}.target{position:absolute;width:76px;height:76px;border:0;border-radius:50%;background:#ef687e;box-shadow:0 8px 0 #ad3b56,0 15px 30px #5a6f9540;touch-action:manipulation}.target:active{transform:translateY(5px);box-shadow:0 3px 0 #ad3b56}.start{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);min-width:190px;min-height:58px;padding:12px 22px;border:0;border-radius:14px;background:#2868c7;color:white;font:700 19px system-ui;box-shadow:0 10px 30px #234d8b44}@media(max-width:360px){.top{flex-wrap:wrap}.info{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<main><div class="field" id="field"><button class="target" id="target" aria-label="Поймать круг" hidden></button></div><div class="top"><div><h1>Поймай круг</h1><p class="hint">Касайтесь цели 30 секунд</p></div><div class="info"><span>Очки: <b id="score">0</b></span><span>Время: <b id="time">30</b></span></div></div><button class="start" id="start">Начать игру</button></main>
<script>
const field=document.querySelector('#field'),target=document.querySelector('#target'),start=document.querySelector('#start');
const scoreText=document.querySelector('#score'),timeText=document.querySelector('#time');
let score=0,time=30,timer;
function move(){const edge=12,top=Math.min(110,Math.max(0,field.clientHeight-target.offsetHeight));const width=Math.max(0,field.clientWidth-target.offsetWidth-edge*2),height=Math.max(0,field.clientHeight-target.offsetHeight-top-edge);target.style.left=edge+Math.floor(Math.random()*width)+'px';target.style.top=top+Math.floor(Math.random()*height)+'px'}
function finish(){clearInterval(timer);target.hidden=true;start.hidden=false;start.textContent='Сыграть ещё'}
start.onclick=()=>{clearInterval(timer);score=0;time=30;scoreText.textContent=score;timeText.textContent=time;start.hidden=true;target.hidden=false;move();timer=setInterval(()=>{time--;timeText.textContent=time;if(time<=0)finish()},1000)};
target.onclick=()=>{score++;scoreText.textContent=score;move()};
</script>
</body>
</html>
